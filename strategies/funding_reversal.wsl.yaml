# 内置策略 B：极端费率反转（RANGE 专用）
# 边缘来源: 散户永续仓位极端拥挤 → 均值回归；与趋势策略正交
meta:
  name: 极端费率反转
  id: FR
  version: 1
  regime: RANGE
  symbols: [BTC, ETH, SOL, BNB, XRP, DOGE, LINK, XAU]
  signal_tf: 4h
  enabled: true

entry:
  short: >
    funding_z30 >= 2.0
    and (close - ref(close,24)) / ref(close,24) >= 1.5 * atr(14,'4h') / close
    and rsi(14,'4h') >= 75
    and (lsr_z30 >= 1.5 or lsr >= 1.3)
    and (lsr_delta_4h >= 0.05 or whale_ratio >= 1.6 or lsr_notional > 0)
  long: >
    funding_z30 <= -2.0
    and (close - ref(close,24)) / ref(close,24) <= -1.5 * atr(14,'4h') / close
    and rsi(14,'4h') <= 25
    and (lsr_z30 <= -1.5 or lsr <= 0.8)
    and (lsr_delta_4h <= -0.05 or whale_ratio <= 0.62 or lsr_notional < 0)

exit:
  stop: "ref(highest(24,'4h'),0)"
  target: "ema(20,'4h')"
  time_stop: { bars: 12, min_R: 0 }

risk:
  risk_pct: 1.4
  leverage_cap: 20
