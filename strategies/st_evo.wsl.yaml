# 内置策略 A：趋势回调追踪（ST 进化版）
# 体制: TREND 专用；日线定方向 → 1h 回调入场 → 1R 半仓 + 吊灯追踪 + 趋势破坏离场
meta:
  name: 趋势回调追踪
  id: ST
  version: 2
  regime: TREND
  symbols: [BTC, ETH, SOL, BNB, XRP, DOGE, LINK, XAU]
  signal_tf: 1h
  enabled: true

entry:
  long: >
    close_1d > ema(50,'1d') and ema(20,'1d') > ema(50,'1d')
    and adx(14,'1d') >= 22
    and abs(close - ema(20,'1h')) <= 0.5 * atr(14,'1h')
    and rsi(14,'1h') >= 40 and rsi(14,'1h') <= 52
    and (close > ref(highest(1),1) or volume >= 1.3 * sma(volume,20,'1h'))
    and (lsr_delta_2m >= -0.2 or lsr_delta_2m != lsr_delta_2m)
  short: >
    close_1d < ema(50,'1d') and ema(20,'1d') < ema(50,'1d')
    and adx(14,'1d') >= 22
    and abs(close - ema(20,'1h')) <= 0.5 * atr(14,'1h')
    and rsi(14,'1h') >= 48 and rsi(14,'1h') <= 60
    and (close < ref(lowest(1),1) or volume >= 1.3 * sma(volume,20,'1h'))
    and (lsr_delta_2m <= 0.2 or lsr_delta_2m != lsr_delta_2m)

exit:
  partial: { at_R: 1.0, pct: 50, move_stop: breakeven }
  chandelier: { k: 3, tf: '1h' }
  structure: "close_1d < ema(20,'1d')"
  time_stop: { bars: 120, min_R: 0.5 }

risk:
  risk_pct: 2
  leverage_cap: 20
