<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="William 量化看板 W1 — 机构级分析框架：每日判断、姿态评分、8币立场、情绪、资金流、多空LSR、费率套利、KOL共识、全球资产（美股/大宗/外汇/美债）、财报日历、宏观仪表盘、全网KOL观点、翻转倒计时，审批制会员系统。">
<title>William 量化看板 W1</title>
<style>
/* ============ William 量化看板 W1 · 深色量化终端（低饱和） ============ */
:root{
  --bg0:#14161a; --bg1:#1b1e24; --bg2:#22262d; --bg3:#2a2f38;
  --line:#31363f; --line2:#3c424d;
  --amber:#d9a441; --amber-dim:#8a6c30; --amber-soft:rgba(217,164,65,.12);
  --text:#d8d5cd; --text2:#9d998f; --text3:#6d6a62;
  --green:#5f9e7a; --green-soft:rgba(95,158,122,.14);
  --red:#c06a5e; --red-soft:rgba(192,106,94,.14);
  --yellow:#c9a24d;
  /* 涨跌配色：默认绿涨红跌；body.cn-flip 时红涨绿跌 */
  --up:var(--green); --down:var(--red);
  --up-soft:var(--green-soft); --down-soft:var(--red-soft);
  --serif:"Iowan Old Style","Palatino Linotype","Book Antiqua",Georgia,"Songti SC","SimSun",serif;
  --mono:"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:-apple-system,"Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg0);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.6;min-height:100vh}
a{color:var(--amber);text-decoration:none}
a:hover{text-decoration:underline}
::selection{background:var(--amber-dim);color:#fff}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:var(--bg0)}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:4px}
/* ---- 姿态评分速度表 ---- */
@keyframes slideUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes needleSweep{from{transform:rotate(-90deg)}to{transform:rotate(var(--needle-deg,0deg))}}
@keyframes countUp{from{opacity:0}to{opacity:1}}
/* ---- 全局页面入场动画（所有选项卡统一） ---- */
#main>*{animation:mainIn .35s ease-out}
@keyframes mainIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@media (prefers-reduced-motion: reduce){#main>*{animation:none}}

.posture-dashboard{display:grid;grid-template-columns:0.52fr 1.75fr;gap:14px;animation:slideUp .6s ease-out}
.posture-gauge{background:var(--bg1);border-radius:8px;padding:12px 10px 14px;display:flex;flex-direction:column;align-items:center;justify-content:center;animation:slideUp .6s ease-out .1s both}
.posture-gauge svg{width:100%;max-width:190px;height:auto}
.gauge-score-text{font-size:32px;font-weight:700;line-height:1;margin-top:-12px;font-family:var(--mono)}
.gauge-state-text{font-size:13px;font-weight:500;opacity:.8;margin-top:3px}
.gauge-sub{font-size:10px;color:var(--text3);margin-top:5px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.gauge-sub span{background:var(--bg2);padding:3px 10px;border-radius:4px}
.posture-chart{background:var(--bg1);border-radius:8px;padding:12px 16px 16px;display:flex;flex-direction:column;animation:slideUp .6s ease-out .2s both}
.posture-chart .chart-title{font-size:12px;color:var(--text3);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.posture-chart .chart-box{flex:1;min-height:250px}
.tf-bar{display:flex;gap:4px;margin:0 0 6px auto}
.tf-btn{font-size:10px;line-height:1;padding:3px 8px;border-radius:4px;border:1px solid var(--line);background:var(--bg2);color:var(--text3);cursor:pointer;transition:all .15s}
.tf-btn:hover{color:var(--text1);border-color:var(--accent)}
.tf-btn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.factor-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.factor-item{background:var(--bg2);padding:6px 10px;border-radius:4px;display:flex;justify-content:space-between;align-items:center;font-size:11px}
.factor-item .fl{color:var(--text3)}
.factor-item .fv{font-weight:600;font-family:var(--mono);font-size:12px}
.factor-item .fv.pos{color:var(--up)}
.factor-item .fv.neg{color:var(--down)}
.factor-item .fv.zero{color:var(--text3)}

/* ---- OpenClue \u6bcf\u65e5\u6458\u8981 ---- */
.hero-brief{background:var(--bg1);border-radius:8px;padding:16px;margin-bottom:12px;animation:slideUp .5s ease-out both}
.hero-brief .hb-headline{font-size:15px;font-weight:600;line-height:1.5;margin-bottom:8px}
.hero-brief .hb-quote{font-size:13px;line-height:1.7;color:var(--text2)}
.hero-brief .hb-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;font-size:11px;color:var(--text3)}
.hero-brief .hb-pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.hero-brief .hb-pill{font-size:10px;padding:2px 8px;border-radius:4px;border:1px solid var(--line2)}
.hero-brief .hb-pill.bullish{border-color:var(--up);color:var(--up)}
.hero-brief .hb-pill.bearish{border-color:var(--down);color:var(--down)}
.hero-brief .hb-pill.cautious,.hero-brief .hb-pill.mixed{border-color:#d9a441;color:var(--yellow)}
.hero-brief .hb-pill.neutral{border-color:var(--text3);color:var(--text3)}
.hero-brief .hb-history{display:block;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.hero-brief .hb-history-item{font-size:11px;color:var(--text3);padding:7px 10px;border-radius:6px;background:var(--bg2);cursor:pointer;transition:background .2s;margin-bottom:4px;display:flex;align-items:center;gap:6px;line-height:1.4}
.hero-brief .hb-history-item:hover{background:var(--bg3)}
.hero-brief .hb-history-date{color:var(--amber);font-family:var(--mono);font-size:10px;flex-shrink:0}
.hero-brief .hb-history-arrow{margin-left:auto;color:var(--text3);font-size:10px;transition:transform .2s;flex-shrink:0}
.hero-brief .hb-history-head:hover{color:var(--text2)}
.hero-brief .hb-history-detail{padding:8px 10px;margin:0 0 6px;border-left:2px solid var(--amber);background:var(--bg2);border-radius:0 6px 6px 0;animation:fadeIn .2s}


/* ---- 顶栏 ---- */
.topbar{border-bottom:1px solid var(--line);background:linear-gradient(180deg,#191c21,#14161a);position:sticky;top:0;z-index:50}
.topbar-inner{max-width:1280px;margin:0 auto;padding:14px 20px 10px}
.brand-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;font-family:var(--serif);font-size:22px;letter-spacing:.5px;color:var(--amber);text-shadow:0 0 14px rgba(217,164,65,.35),0 0 2px rgba(217,164,65,.2)}
.brand em{font-style:normal;color:#f2da92}
.brand-logo{width:36px;height:36px;flex:none;filter:drop-shadow(0 2px 8px rgba(217,164,65,.28))}
.brand-sub{font-family:var(--mono);font-size:11px;color:var(--text3);letter-spacing:1px;text-transform:uppercase}
.top-actions{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.clock{font-family:var(--mono);font-size:12px;color:var(--text2)}
@media(max-width:860px){.clock{display:none}.user-chip .vip-badge{font-size:9.5px;padding:0 6px}}
.lang-btn,.ghost-btn{background:var(--bg2);border:1px solid var(--line2);color:var(--text2);font-size:12px;padding:5px 12px;border-radius:4px;cursor:pointer;font-family:var(--sans);transition:.15s}.oi-g{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}.oi-i{background:var(--bg2);border-radius:6px;padding:8px 10px}.oi-l{font-size:11px;color:var(--text3);margin-bottom:2px}.oi-v{font-size:15px;font-weight:600;font-family:var(--mono)}.oi-bar-wrap{display:flex;align-items:center;gap:10px;margin:6px 0}.oi-bar{flex:1;height:16px;border-radius:8px;background:#1a1c21;overflow:hidden}.oi-bar-f{height:100%;border-radius:8px;transition:width .5s}.oi-bar-l{font-size:13px;font-family:var(--mono);min-width:58px;text-align:right}
.lang-btn:hover,.ghost-btn:hover{border-color:var(--amber-dim);color:var(--amber)}
/* ---- 涨跌配色切换按钮 ---- */
body.cn-flip{--up:var(--red);--down:var(--green);--up-soft:var(--red-soft);--down-soft:var(--green-soft)}
.color-btn{display:inline-flex;align-items:center;gap:4px;background:var(--bg2);border:1px solid var(--line2);color:var(--text2);font-size:11px;padding:5px 9px;border-radius:4px;cursor:pointer;font-family:var(--mono);transition:.15s;line-height:1}
.color-btn:hover{border-color:var(--amber-dim);color:var(--amber)}
.color-btn .cb-up{color:var(--up);font-weight:700;font-size:10px}
.color-btn .cb-down{color:var(--down);font-weight:700;font-size:10px}
.color-btn .cb-arr{display:flex;flex-direction:column;line-height:.9}
.user-chip{font-family:var(--mono);font-size:11.5px;color:var(--green);border:1px solid rgba(95,158,122,.35);padding:2px 8px;border-radius:4px;background:var(--green-soft);display:inline-flex;align-items:center;white-space:nowrap}
#vipChip{display:inline-flex;align-items:center}

/* ---- Tab 导航 ---- */
.tabnav{max-width:1280px;margin:0 auto;padding:0 20px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabnav::-webkit-scrollbar{display:none}
.tab{padding:9px 14px;font-size:13px;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:.15s;user-select:none}
.tab:hover{color:var(--text)}
.tab.active{color:var(--amber);border-bottom-color:var(--amber);font-weight:600}
.tab .lock{font-size:10px;color:var(--text3);margin-left:3px}
.tab.member-tab.active .lock{color:var(--amber-dim)}

/* ---- 主体 ---- */
main{max-width:1280px;margin:0 auto;padding:20px}
.panel{display:none;animation:fadein .25s ease}
.panel.active{display:block}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ---- 卡片 ---- */
.card{background:var(--bg1);border:1px solid var(--line);border-radius:8px;padding:18px 20px;margin-bottom:16px}
.card-title{font-family:var(--serif);font-size:16px;color:var(--text);margin-bottom:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card-title::before{content:"";width:3px;height:16px;background:var(--amber);border-radius:2px;flex:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media(max-width:960px){.grid2,.grid3,.grid4{grid-template-columns:1fr}}

/* ---- 徽章 / 状态 ---- */
.badge{display:inline-block;font-family:var(--mono);font-size:11px;padding:2px 9px;border-radius:3px;letter-spacing:.5px;border:1px solid}
.badge.bullish,.badge.risk_on,.badge.aggressive{color:var(--up);border-color:rgba(95,158,122,.4);background:var(--up-soft)}
.badge.approved{color:var(--green);border-color:rgba(95,158,122,.4);background:var(--green-soft)}
.badge.cautiously_bullish{color:#8aa37a;border-color:rgba(138,163,122,.35);background:rgba(138,163,122,.1)}
.badge.neutral,.badge.cautious,.badge.pending{color:var(--amber);border-color:rgba(217,164,65,.35);background:var(--amber-soft)}
.badge.cautiously_bearish{color:#b98a6b;border-color:rgba(185,138,107,.35);background:rgba(185,138,107,.1)}
.badge.bearish,.badge.risk_off,.badge.defensive{color:var(--down);border-color:rgba(192,106,94,.4);background:var(--down-soft)}
.badge.rejected{color:var(--red);border-color:rgba(192,106,94,.4);background:var(--red-soft)}
.badge.diverge{color:var(--yellow);border-color:rgba(201,162,77,.5);background:rgba(201,162,77,.12)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px}
.dot.g{background:var(--green);box-shadow:0 0 6px rgba(95,158,122,.6)}
.dot.y{background:var(--yellow)}
.dot.r{background:var(--red)}
.dot.gray{background:var(--text3)}

/* ---- 每日判断卡 ---- */
.verdict-hero{display:grid;grid-template-columns:340px 1fr;gap:20px}
@media(max-width:960px){.verdict-hero{grid-template-columns:1fr}}
.verdict-main-text{font-family:var(--serif);font-size:17px;line-height:1.8;color:var(--text)}
.verdict-label{font-family:var(--mono);font-size:10px;color:var(--text3);letter-spacing:2px;text-transform:uppercase;margin:14px 0 4px}
.verdict-block{font-size:13px;color:var(--text2);line-height:1.75}
.verdict-block b{color:var(--text);font-weight:600}
.whatsnew{border-left:2px solid var(--amber-dim);padding-left:12px;margin-top:12px;font-size:13px;color:var(--text2)}
.diverge-box{margin-top:12px;padding:10px 14px;border:1px dashed rgba(201,162,77,.45);border-radius:6px;font-size:12.5px;color:var(--yellow);background:rgba(201,162,77,.06)}
.quote-box{font-family:var(--serif);font-style:italic;font-size:14.5px;line-height:1.8;color:var(--text2);border-left:3px solid var(--amber);padding:6px 0 6px 16px;margin:4px 0}
.quote-src{font-style:normal;font-family:var(--mono);font-size:10.5px;color:var(--text3);display:block;margin-top:6px}

/* ---- posture 仪表 ---- */
.gauge-wrap{display:flex;flex-direction:column;align-items:center;gap:6px}
.gauge-score{font-family:var(--mono);font-size:34px;color:var(--amber);line-height:1}
.gauge-state{font-family:var(--serif);font-size:15px}
.days-held{font-family:var(--mono);font-size:11px;color:var(--text3)}
.factor-row{display:grid;grid-template-columns:130px 1fr 46px;align-items:center;gap:10px;margin:7px 0;font-size:12px}
.factor-name{color:var(--text2)}
.factor-bar{position:relative;height:10px;background:var(--bg2);border-radius:5px;overflow:hidden}
.factor-center{position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--line2)}
.factor-fill{position:absolute;top:0;bottom:0;border-radius:5px}
.factor-fill.pos{background:var(--up);opacity:.75}
.factor-fill.neg{background:var(--down);opacity:.75}
.factor-val{font-family:var(--mono);font-size:11px;text-align:right;color:var(--text2)}

/* ---- 表格 ---- */
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{font-family:var(--mono);font-size:10.5px;letter-spacing:1px;color:var(--text3);text-transform:uppercase;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line2);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);color:var(--text2);vertical-align:middle}
tr:hover td{background:rgba(255,255,255,.02)}

/* ---- 表格自动防溢出：容器横向滚动 + 表格不撑破布局（全局自动化，无需人工） ---- */
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
.table-scroll>table{width:auto;min-width:100%;white-space:nowrap}
.table-scroll>table td,.table-scroll>table th{white-space:nowrap}

.num{font-family:var(--mono);font-size:12.5px}
.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--text3)}.warn{color:var(--amber)!important}
tr.pending-row td{background:rgba(217,164,65,.07)}
tr.pending-row td:first-child{border-left:2px solid var(--amber)}

/* ---- 移动端表格压缩（仅手机，不动桌面端） ---- */
@media(max-width:860px){
  table{font-size:11px;min-width:0}
  th{font-size:9px;padding:6px 6px;letter-spacing:.4px;white-space:nowrap}
  td{padding:6px 6px;font-size:11px}
  .num{font-size:11px}
  /* 表格容器允许横向滚动，但不让它撑破页面整体宽度 */
  main{padding:12px 10px}
  .tabnav{padding:0 10px}
  .topbar-inner{padding:12px 12px 8px}
  /* 减少表格内padding，列更紧凑 */
  td.num,td>span{word-break:break-word}
  /* 身份证样长内容截断 */
  td{max-width:140px;overflow:hidden;text-overflow:ellipsis}
}
@media(max-width:480px){
  th{font-size:8.5px;padding:5px 4px}
  td{padding:5px 4px;font-size:10.5px}
  table{font-size:10.5px}
  .num{font-size:10.5px}
}


/* ---- 8币卡 ---- */
.coin-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media(max-width:1100px){.coin-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.coin-grid{grid-template-columns:1fr}}
.coin-card{background:var(--bg1);border:1px solid var(--line);border-radius:8px;padding:15px 16px;position:relative;transition:border-color .2s}
.coin-card:hover{border-color:var(--line2)}
.coin-card.diverged{border-color:rgba(201,162,77,.55)}
.coin-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.coin-sym{font-family:var(--serif);font-size:17px;letter-spacing:.5px}
.coin-price{font-family:var(--mono);font-size:15px;margin:6px 0 2px}
.conf-bar{height:4px;background:var(--bg2);border-radius:2px;margin:9px 0 6px;overflow:hidden}
.conf-fill{height:100%;background:var(--amber);border-radius:2px}
.coin-headline{font-size:12px;color:var(--text2);line-height:1.6;min-height:38px}
.coin-official{margin-top:9px;padding-top:8px;border-top:1px dashed var(--line);font-size:11px;color:var(--text3)}
.coin-official .of-tag{font-family:var(--mono);font-size:9.5px;letter-spacing:1px;text-transform:uppercase}

/* ---- 锁定卡 ---- */
.lock-card{background:var(--bg1);border:1px solid var(--line);border-radius:8px;padding:52px 30px;text-align:center;max-width:560px;margin:30px auto}
.lock-icon{font-size:34px;margin-bottom:14px;opacity:.85}
.lock-title{font-family:var(--serif);font-size:19px;margin-bottom:8px}
.lock-desc{color:var(--text2);font-size:13px;max-width:400px;margin:0 auto 20px}
.btn{background:var(--amber);color:#1a1408;border:none;font-size:13px;font-weight:600;padding:9px 22px;border-radius:5px;cursor:pointer;transition:.15s;font-family:var(--sans)}
.btn:hover{background:#e8b654}
.btn.secondary{background:var(--bg2);color:var(--text2);border:1px solid var(--line2);font-weight:400}
.btn.secondary:hover{border-color:var(--amber-dim);color:var(--amber);background:var(--bg2)}
.btn.danger{background:transparent;color:var(--red);border:1px solid rgba(192,106,94,.4)}
.btn.danger:hover{background:var(--red-soft)}
.btn.small{padding:4px 12px;font-size:12px}

/* ---- 表单 ---- */
.form-box{max-width:400px;margin:24px auto}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--text2);margin-bottom:5px}
.field input{width:100%;background:var(--bg2);border:1px solid var(--line2);border-radius:5px;color:var(--text);font-size:14px;padding:9px 12px;outline:none;transition:.15s;font-family:var(--sans)}
.field input:focus{border-color:var(--amber-dim)}
.form-msg{font-size:12.5px;margin:10px 0;min-height:18px}
.form-msg.err{color:var(--red)}.form-msg.ok{color:var(--green)}
.form-switch{text-align:center;font-size:12.5px;color:var(--text2);margin-top:14px}

/* ---- 词典 ---- */
.glossary-grid{display:flex;flex-wrap:wrap;gap:8px}
.g-term{background:var(--bg2);border:1px solid var(--line2);border-radius:6px;padding:6px 11px;cursor:pointer;transition:.15s;user-select:none;display:inline-flex;align-items:baseline;gap:6px;max-width:100%}
.g-term:hover{border-color:var(--amber-dim);background:var(--bg3)}
.g-term.open{border-color:var(--amber);background:rgba(217,164,65,.08)}
.g-term .gt-zh{font-size:12.5px;color:var(--text);font-weight:500;white-space:nowrap}
.g-term .gt-en{font-size:10.5px;color:var(--text3);font-family:var(--mono)}
.g-term .gt-arrow{font-size:9px;color:var(--amber);transition:transform .2s}
.g-term.open .gt-arrow{transform:rotate(180deg)}
.g-detail{flex-basis:100%;background:var(--bg1);border:1px solid var(--line);border-left:3px solid var(--amber);border-radius:6px;padding:10px 14px;font-size:12px;color:var(--text2);line-height:1.7;animation:fadeIn .2s}
@media(max-width:860px){.g-term{flex:1 1 auto}}

/* ---- 留言板 ---- */
.msg-composer{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:14px}
.msg-composer textarea{width:100%;min-height:70px;background:var(--bg1);border:1px solid var(--line2);border-radius:6px;color:var(--text);font-family:var(--sans);font-size:13px;padding:10px;resize:vertical;outline:none}
.msg-composer textarea:focus{border-color:var(--amber-dim)}
.msg-composer .msg-bar{display:flex;align-items:center;justify-content:space-between;margin-top:8px;gap:8px;flex-wrap:wrap}
.msg-composer .msg-count{font-size:11px;color:var(--text3);font-family:var(--mono)}
.msg-composer .msg-count.warn{color:var(--amber)}
.msg-list{display:flex;flex-direction:column;gap:8px}
.msg-item{display:flex;gap:10px;background:var(--bg1);border:1px solid var(--line);border-radius:8px;padding:10px 12px;align-items:flex-start;animation:fadeIn .25s}
.msg-avatar{width:34px;height:34px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;margin-top:2px;user-select:none}
.msg-body{flex:1;min-width:0}
.msg-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:3px}
.msg-user{font-size:13px;font-weight:600;color:var(--text)}
.msg-time{font-size:10.5px;color:var(--text3);font-family:var(--mono)}
.msg-content{font-size:13px;color:var(--text2);line-height:1.65;word-break:break-word;white-space:pre-wrap}
.msg-del{font-size:10.5px;color:var(--text3);cursor:pointer;padding:1px 6px;border-radius:3px;border:1px solid transparent}
.msg-del:hover{color:var(--red);border-color:var(--line2)}
.msg-empty{text-align:center;padding:50px 20px;color:var(--text3);font-size:12px}
.msg-login-hint{font-size:11.5px;color:var(--text3);background:var(--bg2);border:1px dashed var(--line2);border-radius:6px;padding:10px;text-align:center;margin-bottom:12px}
.msg-login-hint b{color:var(--amber)}
/* ---- 图表 ---- */
.chart-box{background:var(--bg2);border:1px solid var(--line);border-radius:6px;padding:12px}
svg text{font-family:var(--mono)}
.legend{display:flex;gap:16px;font-size:11px;color:var(--text3);margin-top:6px;flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* ---- AI 日报时间线 ---- */
.timeline{position:relative;padding-left:22px}
.timeline::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:1px;background:var(--line2)}
.tl-item{position:relative;margin-bottom:18px}
.tl-item::before{content:"";position:absolute;left:-19px;top:7px;width:7px;height:7px;border-radius:50%;background:var(--amber-dim);border:2px solid var(--bg0)}
.tl-date{font-family:var(--mono);font-size:11.5px;color:var(--amber);letter-spacing:1px}
.tl-src{font-family:var(--mono);font-size:10px;color:var(--text3);margin-left:8px}
.tl-text{font-size:13px;color:var(--text2);margin-top:3px;line-height:1.75}

/* ---- 倒计时 ---- */
.cond-card{background:var(--bg2);border:1px solid var(--line);border-radius:6px;padding:14px 16px;margin-bottom:12px}
.cond-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.cond-label{font-family:var(--serif);font-size:14.5px}
.cond-bucket{font-family:var(--mono);font-size:11px}
.progress{height:8px;background:var(--bg0);border-radius:4px;overflow:hidden;margin:8px 0 6px}
.progress-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--amber-dim),var(--amber));transition:width .5s}
.cond-line{font-size:12px;color:var(--text2)}

/* ---- 数据时间/stale ---- */
.data-ts{font-family:var(--mono);font-size:10.5px;color:var(--text3);letter-spacing:.5px}
/* ---- 会员徽章（情绪价值 UI） ---- */
.vip-badge{display:inline-flex;align-items:center;gap:3px;padding:1px 8px;border-radius:10px;font-size:10.5px;font-weight:600;letter-spacing:.2px;border:1px solid transparent;line-height:1.6;white-space:nowrap}
.vip-owner{background:linear-gradient(135deg,#ffd700,#b8860b);color:#1a1200;border-color:#ffd700;box-shadow:0 0 10px rgba(255,215,0,.4)}
.vip-eternal{background:linear-gradient(135deg,#b388ff,#7c4dff);color:#fff;border-color:#b388ff;box-shadow:0 0 10px rgba(124,77,255,.4)}
.vip-gold{background:linear-gradient(135deg,#f6d365,#fda085);color:#4a2c00;border-color:#f6d365}
.vip-platinum{background:linear-gradient(135deg,#e0e6ef,#b0bccb);color:#1e2630;border-color:#cfd8e3}
.vip-normal{background:linear-gradient(135deg,#4a5260,#353c47);color:#cfd6e0;border-color:#4a5260}
.vip-expired{background:linear-gradient(135deg,#5c2f2f,#3d1f1f);color:#ff9d9d;border-color:#7a3a3a}
.vip-chip-owner{color:#ffd700;text-shadow:0 0 8px rgba(255,215,0,.5)}
.vip-hero{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:10px;margin-bottom:12px;flex-wrap:wrap}
.vip-hero .vip-title{font-size:15px;font-weight:700;font-family:var(--serif)}
.vip-hero .vip-meta{font-size:12px;color:var(--text2)}
.admin-set{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.admin-set input[type=number]{width:60px;padding:3px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg1);color:var(--text);font-size:12px}


.kb-inp{background:var(--bg1);border:1px solid var(--line);border-radius:8px;padding:8px 12px;color:var(--text);font-size:12.5px;outline:none}
.kb-inp:focus{border-color:var(--amber)}
.kb-ask-item{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;background:rgba(255,255,255,.015)}
.kb-ask-q{font-weight:600;color:var(--amber);font-size:13px;margin-bottom:8px}
.kb-ask-a{font-size:12.5px;color:var(--text);line-height:1.75}
.kb-ask-a .kb-p{margin:4px 0}
.kb-refs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}

.kb-chat{display:flex;flex-direction:column;gap:10px;height:540px}
.kb-chat-msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:10px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.012)}
.kb-chat-row{display:flex}
.kb-chat-row.user{justify-content:flex-end}
.kb-chat-row.assistant{justify-content:flex-start}
.kb-bubble{max-width:82%;padding:9px 13px;border-radius:12px;font-size:12.5px;line-height:1.7}
.kb-bubble.user{background:var(--amber-soft);border:1px solid var(--amber-dim);color:var(--text)}
.kb-bubble.assistant{background:var(--bg2);border:1px solid var(--line);color:var(--text)}
.kb-bubble .kb-p{margin:3px 0}
.kb-thinking{color:var(--text3);font-style:italic}
.kb-chat-modes{display:flex;gap:6px;align-items:center}
.kb-chat-input{display:flex;gap:8px}
.kb-chat-input input{flex:1;background:var(--bg1);border:1px solid var(--line);border-radius:10px;padding:9px 14px;color:var(--text);font-size:13px;outline:none}
.kb-chat-input input:focus{border-color:var(--amber)}

.kb-chat-quick{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.kb-ts{font-size:10px;margin-right:8px}
.kb-mtag{margin-right:6px}
.kb-stat{margin:4px 0 2px}

.kb-bubble .kb-h{color:var(--amber);margin:10px 0 4px;font-weight:700}
.kb-bubble h3.kb-h{font-size:13.5px}.kb-bubble h4.kb-h{font-size:12.5px}.kb-bubble h5.kb-h{font-size:12px}
.kb-bubble .kb-li{margin:2px 0 2px 10px;font-size:12.5px;line-height:1.7}
.kb-bubble .kb-tbl{font-family:var(--mono);font-size:10.5px;color:var(--text2);border-bottom:1px dashed var(--line);padding:2px 0}
.kb-bubble code{background:var(--bg3);border-radius:4px;padding:1px 4px;font-family:var(--mono);font-size:11px;color:var(--amber)}

.kb-chat{display:flex;flex-direction:column;gap:10px;height:min(540px,62vh)}
.kb-chat-toolbar{display:flex;align-items:center;gap:8px}
.kb-copy{font-size:10.5px;padding:2px 8px;margin-left:6px}
/* ---- 7宝知识库 ---- */
.kb-subtabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.kb-subtab{padding:5px 14px;border-radius:20px;border:1px solid var(--line);font-size:12px;cursor:pointer;color:var(--text2);transition:all .15s;user-select:none}
.kb-subtab:hover{border-color:var(--amber-dim);color:var(--text)}
.kb-subtab.active{background:var(--amber-soft);border-color:var(--amber);color:var(--amber)}
.kb-body{display:flex;flex-direction:column;gap:12px;min-height:320px}
.kb-grid2{display:grid;grid-template-columns:280px 1fr;gap:14px}
@media(max-width:900px){.kb-grid2{grid-template-columns:1fr}}
.kb-tree{display:flex;flex-direction:column;gap:2px;max-height:540px;overflow-y:auto;padding-right:6px;border:1px solid var(--line);border-radius:10px;padding:8px}
.kb-file-title{font-size:12px;font-weight:700;color:var(--amber);margin:8px 0 4px;letter-spacing:.5px}
.kb-file-title:first-child{margin-top:2px}
.kb-node{padding:4px 8px;font-size:12px;color:var(--text2);cursor:pointer;border-left:2px solid transparent;border-radius:0 6px 6px 0;line-height:1.45}
.kb-node:hover{background:rgba(255,255,255,.04);color:var(--text)}
.kb-node.active{border-left-color:var(--amber);background:var(--amber-soft);color:var(--amber)}
.kb-reader{border:1px solid var(--line);border-radius:10px;padding:14px 18px;max-height:560px;overflow-y:auto;background:rgba(255,255,255,.015)}
.kb-reader .kb-h{color:var(--amber);margin:10px 0 6px;font-weight:700}
.kb-reader h3.kb-h{font-size:16px}.kb-reader h4.kb-h{font-size:14px}.kb-reader h5.kb-h{font-size:13px}.kb-reader h6.kb-h{font-size:12px}
.kb-reader .kb-p{margin:4px 0;font-size:12.5px;line-height:1.75;color:var(--text)}
.kb-reader .kb-li{margin:2px 0 2px 12px;font-size:12.5px;line-height:1.7;color:var(--text)}
.kb-reader .kb-tbl{font-family:var(--mono);font-size:11px;color:var(--text2);border-bottom:1px dashed var(--line);padding:3px 0}
.kb-reader code{background:var(--bg3);border-radius:4px;padding:1px 5px;font-family:var(--mono);font-size:11px;color:var(--amber)}
.kb-reader pre.kb-code{background:var(--bg1);border:1px solid var(--line);border-radius:8px;padding:10px;font-family:var(--mono);font-size:11.5px;overflow-x:auto;color:#9fd0ff;white-space:pre-wrap}
.kb-meta{font-size:11px;color:var(--text3);font-family:var(--mono);margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.kb-search-box{display:flex;gap:8px;margin-bottom:12px}
.kb-search-box input{flex:1;background:var(--bg1);border:1px solid var(--line);border-radius:10px;padding:9px 14px;color:var(--text);font-size:13px;outline:none;transition:border .15s}
.kb-search-box input:focus{border-color:var(--amber)}
.kb-result{display:flex;flex-direction:column;gap:4px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;cursor:pointer;transition:all .15s}
.kb-result:hover{border-color:var(--amber-dim);background:rgba(255,255,255,.02);transform:translateX(2px)}
.kb-result .kb-rh{display:flex;align-items:center;gap:8px;font-size:13px}
.kb-result .kb-rh b{color:var(--text)}
.kb-result .kb-rh .sc{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--amber)}
.kb-result .kb-rh .fl{font-size:10.5px;color:var(--text3);font-family:var(--mono)}
.kb-result .kb-hit{font-size:12px;color:var(--text2);line-height:1.6}
.kb-result .kb-hit em{background:rgba(217,164,65,.22);color:var(--amber);font-style:normal;border-radius:3px;padding:0 2px}
.kb-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kb-kpi{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:rgba(255,255,255,.015)}
.kb-kpi .lbl{font-size:11px;color:var(--text3)}
.kb-kpi .val{font-size:18px;font-weight:700;font-family:var(--mono);color:var(--text);margin-top:2px}
.kb-kpi .sub{font-size:10.5px;color:var(--text3);margin-top:2px}
.kb-kpi .up{color:#2ebd85}.kb-kpi .down{color:#ff5d5d}
.kb-chart-head{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 6px}
.kb-chip{padding:3px 10px;border-radius:14px;border:1px solid var(--line);font-size:11px;cursor:pointer;color:var(--text2)}
.kb-chip:hover{color:var(--text)}
.kb-chip.active{background:var(--amber-soft);border-color:var(--amber);color:var(--amber)}
.kb-news{display:flex;flex-direction:column;gap:5px;max-height:280px;overflow-y:auto}
.kb-news div{font-size:12px;color:var(--text2);line-height:1.55;padding:5px 8px;border-left:2px solid var(--line);background:rgba(255,255,255,.012)}
.kb-pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.kb-pill{padding:5px 14px;border-radius:16px;border:1px solid var(--line);font-size:12px;cursor:pointer;font-family:var(--mono)}
.kb-pill:hover{color:var(--text)}
.kb-pill.active{background:var(--amber-soft);border-color:var(--amber);color:var(--amber)}
.kb-engine-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.kb-score{font-size:30px;font-weight:800;font-family:var(--mono)}
.kb-score.pos{color:#2ebd85}.kb-score.neg{color:#ff5d5d}.kb-score.flat{color:var(--amber)}
.kb-dims{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.kb-dim{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:rgba(255,255,255,.015)}
.kb-dim .t{font-size:11px;color:var(--text3)}
.kb-dim .v{font-size:14px;font-weight:600;margin-top:3px}
.kb-dim .d{font-size:10.5px;color:var(--text3);margin-top:2px}
.kb-inject{display:flex;flex-direction:column;gap:6px}
.kb-inject-card{border:1px dashed var(--line2);border-radius:8px;padding:8px 12px;font-size:12px;color:var(--text2);line-height:1.6;background:rgba(217,164,65,.03)}
.kb-inject-card b{color:var(--amber)}
.kb-badge{display:inline-block;padding:1px 8px;border-radius:10px;font-size:10.5px;font-weight:600}
.kb-badge.add{background:rgba(46,189,133,.15);color:#2ebd85}
.kb-badge.mod{background:rgba(217,164,65,.15);color:var(--amber)}
.kb-badge.del{background:rgba(255,93,93,.15);color:#ff5d5d}
.kb-badge.actor{background:var(--bg3);color:var(--text3)}
.kb-tbl2{width:100%;border-collapse:collapse;font-size:12px}
.kb-tbl2 th{text-align:left;color:var(--text3);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);font-size:11px}
.kb-tbl2 td{padding:5px 8px;border-bottom:1px solid rgba(255,255,255,.04);font-family:var(--mono);font-size:11.5px;color:var(--text2)}
.kb-tbl2 tr:hover td{background:rgba(255,255,255,.02)}
.kb-banner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;border-radius:10px;border:1px solid var(--line);font-size:12.5px}
.kb-banner.ok{border-color:rgba(46,189,133,.4);background:rgba(46,189,133,.06)}
.kb-banner.warn{border-color:rgba(217,164,65,.4);background:rgba(217,164,65,.06)}
.kb-empty{color:var(--text3);font-size:12.5px;padding:20px;text-align:center}
/* ---- 系统蓝图 ---- */
.blueprint{display:flex;flex-direction:column;gap:6px}
.bp-layer{background:linear-gradient(135deg,rgba(255,255,255,.02),rgba(255,255,255,0));border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.bp-layer-title{font-size:12px;font-weight:700;color:var(--amber);letter-spacing:.5px;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.bp-layer-title .bp-tag{font-size:10px;color:var(--text3);font-weight:400;margin-left:auto;letter-spacing:0}
.bp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.bp-node{font-size:11px;color:var(--text2);background:var(--bg1);border:1px solid var(--line);border-radius:7px;padding:6px 8px;line-height:1.5}
.bp-node b{color:var(--text);font-weight:600}
.bp-node .bp-alg{display:block;font-size:9.5px;color:var(--text3);margin-top:2px;font-family:var(--mono)}
.bp-arrow{text-align:center;color:var(--amber);font-size:11px;opacity:.7;letter-spacing:4px}
.bp-engine{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:6px}
.bp-engine .bp-node{border-left:3px solid var(--amber)}
.bp-engine .bp-node.v1{border-left-color:var(--green)}
.bp-engine .bp-node.v2{border-left-color:#7c4dff}
.bp-engine .bp-node.v3{border-left-color:#ffd700}
.bp-engine .bp-node.v4{border-left-color:#4da6ff}
.bp-engine .bp-node.v5{border-left-color:#ff8c4d}
.bp-sub{margin-top:6px;padding-top:6px;border-top:1px dashed rgba(255,255,255,.08)}
.bp-sub-title{font-size:10px;font-weight:700;color:var(--text2);margin-bottom:4px;letter-spacing:.3px}
.bp-chips{display:flex;flex-wrap:wrap;gap:3px}
.bp-chip{font-size:9.5px;font-family:var(--mono);color:var(--text2);background:var(--bg2);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
.bp-chip.g{color:#7fbf9a;border-color:rgba(95,158,122,.3)}
.bp-chip.o{color:#e0b36a;border-color:rgba(224,179,106,.3)}



.data-ts.stale{color:var(--red);opacity:.75}
.stale-tag{font-family:var(--mono);font-size:9.5px;color:var(--red);border:1px solid rgba(192,106,94,.4);padding:1px 6px;border-radius:3px;margin-left:6px}
.stale-dim{opacity:.55;filter:grayscale(.4)}

/* ---- 后台 ---- */
.admin-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
@media(max-width:960px){.admin-grid{grid-template-columns:1fr}}
.health-row{display:flex;justify-content:space-between;align-items:center;padding:7px 4px;border-bottom:1px solid var(--line);font-size:12.5px}
.kv-strip{display:flex;gap:18px;flex-wrap:wrap;font-family:var(--mono);font-size:12px;color:var(--text2);margin-bottom:14px}
.cfg-row{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--text2);padding:4px 0;border-bottom:1px dashed rgba(128,128,128,.15)}
.cfg-row input[type=number]{width:76px;background:var(--bg2);border:1px solid var(--line);border-radius:6px;color:var(--text);padding:4px 6px;font-family:var(--mono);font-size:12px;text-align:right}
.cfg-row input[type=checkbox]{accent-color:var(--amber)}
.card-subtitle{font-size:13px;font-weight:600;color:var(--amber);margin-bottom:8px}
.kv-strip b{color:var(--amber);font-weight:400}
.trigger-grid{display:flex;gap:8px;flex-wrap:wrap}

/* ---- 页脚 ---- */
footer{max-width:1280px;margin:30px auto 0;padding:18px 20px 26px;border-top:1px solid var(--line);font-family:var(--mono);font-size:10.5px;color:var(--text3);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--bg3);border:1px solid var(--line2);color:var(--text);font-size:13px;padding:10px 20px;border-radius:6px;z-index:99;opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:1}
.empty{color:var(--text3);font-size:12.5px;padding:20px;text-align:center;font-style:italic}

/* ---- 系统监控：进度条 ---- */
.mon-bar{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;color:var(--text2)}
.mon-bar .bar-track{flex:1;height:8px;background:var(--bg2);border-radius:4px;overflow:hidden;max-width:200px}
.mon-bar .bar-fill{height:100%;border-radius:4px;transition:width .4s}
.mon-bar .bar-fill.green{background:var(--green)}
.mon-bar .bar-fill.yellow{background:var(--yellow)}
.mon-bar .bar-fill.orange{background:#c97d3a}
.mon-bar .bar-fill.red{background:var(--red)}
.mon-bar .bar-label{min-width:70px;text-align:right;color:var(--text)}

/* ---- 系统监控：进程卡片 ---- */
.proc-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
@media(max-width:700px){.proc-grid{grid-template-columns:1fr}}
.proc-card{background:var(--bg1);border:1px solid var(--line);border-radius:6px;padding:10px 12px;font-family:var(--mono);font-size:11px;transition:.15s}

<script>
'use strict';
/* ================= W1 Terminal Frontend Core ================= */
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toggleHbHistory(i){
  const d=document.getElementById('hb-detail-'+i);
  const a=document.getElementById('hb-arrow-'+i);
  if(!d)return;
  const open=d.style.display!=='none';
  d.style.display=open?'none':'block';
  if(a)a.textContent=open?'▸':'▾';
}
function toggleHbHistoryList(){
  const box=document.getElementById('hb-history-list');
  const a=document.getElementById('hb-history-list-arrow');
  if(!box)return;
  const open=box.style.display!=='none';
  box.style.display=open?'none':'block';
  if(a)a.textContent=open?'▸':'▾';
}
const fmtPct=(v,d=2)=>v==null?'—':(v>0?'+':'')+Number(v).toFixed(d)+'%';
const fmtUsd=v=>{if(v==null)return'—';const n=Number(v);if(n>=1e12)return'$'+(n/1e12).toFixed(2)+'T';if(n>=1e9)return'$'+(n/1e9).toFixed(2)+'B';if(n>=1e6)return'$'+(n/1e6).toFixed(1)+'M';if(n>=1e3)return'$'+(n/1e3).toFixed(1)+'K';return'$'+n.toFixed(2)};
const fmtPrice=v=>v==null?'—':(v>=1000?'$'+Number(v).toLocaleString('en-US',{maximumFractionDigits:1}):v>=1?'$'+Number(v).toFixed(2):'$'+Number(v).toFixed(4));
const fmtTs=ts=>{if(!ts)return'—';const d=new Date(ts*1000);return d.toLocaleString('zh-CN',{hour12:false,timeZone:'Asia/Shanghai'})};
const fmtDur=sec=>{if(!sec||sec<0)return'—';const d=Math.floor(sec/86400),h=Math.floor((sec%86400)/3600),m=Math.floor((sec%3600)/60),s=sec%60;return(d?d+'d ':'')+(h?h+'h ':'')+m+'m '+s+'s'};
const barClass=pct=>pct>=85?'red':pct>=70?'orange':pct>=50?'yellow':'green';
const cls=v=>v>0?'up':v<0?'down':'flat';
const stanceZh=s=>({bullish:'看多',cautiously_bullish:'谨慎看多',neutral:'中性',cautiously_bearish:'谨慎看空',bearish:'看空',aggressive:'积极',defensive:'防御',risk_on:'进攻',risk_off:'避险',cautious:'谨慎'}[s]||s);
const stanceEn=s=>({cautiously_bullish:'cautiously bullish',cautiously_bearish:'cautiously bearish',risk_on:'risk on',risk_off:'risk off'}[s]||s);

const state={lang:'zh',user:null,admin:false,tab:'overview',timers:{},cache:{}};
const T=(zh,en)=>state.lang==='zh'?zh:(en||zh);

async function api(path,opts){
  const r=await fetch(path,Object.assign({headers:{'Content-Type':'application/json'}},opts||{}));
  let data=null;try{data=await r.json()}catch(e){}
  if(r.status===401&&data&&data.need_login)return{__needLogin:true,status:401};
  if(r.status===401&&data&&data.need_admin)return{__needAdmin:true,status:401};
  return data||{ok:false,error:'http_'+r.status};
}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2600)}
function dataTsHtml(ts,stale){return `<span class="data-ts${stale?' stale':''}">数据 ${fmtTs(ts)}</span>${stale?'<span class="stale-tag">STALE</span>':''}`}
function clearTimers(){Object.values(state.timers).forEach(clearTimeout);state.timers={}}
const tabRefresh={overview:120000,coins:120000,sentiment:120000,flows:300000,markets:60000,oracle:1800000,liquidation:600000,signals:300000,access:60000,assets:300000,live:30000,news:60000,lsr:120000,funding:120000,consensus:300000,countdown:300000,messages:60000};
function startTabTimer(id,fn){clearTimeout(state.timers[id+'_t']);state.timers[id+'_t']=setTimeout(()=>{if(state.tab===id)fn();startTabTimer(id,fn)},tabRefresh[id]||120000)}

/* ================= Tab 定义 ================= */
const TABS=[
  {id:'overview',zh:'总览',en:'Overview',pub:true},
  {id:'markets',zh:'行情',en:'Markets',pub:true},
  {id:'coins',zh:'8币立场',en:'Stances',pub:true},
  {id:'sentiment',zh:'情绪',en:'Sentiment',pub:true},
  {id:'flows',zh:'资金流',en:'Flows',pub:true},
  {id:'assets',zh:'全球资产',en:'Global',pub:true},
  {id:'glossary',zh:'概念词典',en:'Glossary',pub:true},
  {id:'kb',zh:'7宝知识库',en:'KB',pub:true},
  {id:'market-analysis',zh:'市场分析',en:'Market',pub:false},
  {id:'onchain',zh:'链上数据',en:'On-Chain',pub:false},
  {id:'liquidation',zh:'清算数据',en:'Liquidation',pub:false},
  {id:'oracle',zh:'BTC预言机',en:'BTC Oracle',pub:false},
  {id:'lsr',zh:'多空LSR',en:'LSR',pub:false},
  {id:'funding',zh:'费率套利',en:'Funding Arb',pub:false},
  {id:'consensus',zh:'KOL共识',en:'Consensus',pub:false},
  {id:'news',zh:'消息面',en:'News',pub:false},
  {id:'messages',zh:'留言',en:'Messages',pub:true},
  {id:'countdown',zh:'倒计时',en:'Countdown',pub:false},
  {id:'account',zh:'登录/注册',en:'Account',pub:true},
  {id:'live',zh:'实盘',en:'Live',pub:false},
  {id:'admin',zh:'后台',en:'Admin',pub:true},
];
function renderNav(){
  $('#tabnav').innerHTML=TABS.filter(t=>{
    if(t.admin)return state.admin;
    if(t.pub)return true;
    return !!state.user;
  }).map(t=>`<div class="tab${state.tab===t.id?' active':''}${t.pub?'':' member-tab'}" data-tab="${t.id}">${state.lang==='zh'?t.zh:t.en}${t.pub?'':'<span class="lock">◆</span>'}</div>`).join('');
  $$('#tabnav .tab').forEach(el=>el.onclick=()=>switchTab(el.dataset.tab));
}
function switchTab(id){
  const def=TABS.find(t=>t.id===id);
  state.tab=id;clearTimers();renderNav();
  const main=$('#main');
  if(def.admin&&!state.admin){
    main.innerHTML=`<div class="lock-card">
      <div class="lock-icon">🔒</div>
      <div class="lock-title">${T('仅后台可见','Admin Only')}</div>
      <div class="lock-desc">${T('交易信号界面仅供后台管理员查看。请先进入后台。','The Signals console is admin-only. Please enter the Admin console first.')}</div>
      <button class="btn" id="lockAdmin">${T('进入后台','Enter Admin')}</button>
    </div>`;
    $('#lockAdmin').onclick=()=>switchTab('admin');
    return;
  }
  const _vip=state.user&&state.user.vip;const _vipLocked=!def.pub&&state.user&&_vip&&_vip.expired;if(!def.pub&&(!state.user||_vipLocked)){main.innerHTML=lockCardHtml(def,_vip);bindLockCard();return}
  PANELS[id]();
}
function lockCardHtml(def,vip){
  const expired=vip&&vip.expired;
  return `<div class="lock-card">
    <div class="lock-icon">${expired?'⏳':'◆'}</div>
    <div class="lock-title">${T(expired?'会员已到期':'会员专享 · '+def.zh, expired?'Membership Expired':'Members Only')}</div>
    <div class="lock-desc">${expired
      ? T('您的会员已到期，额度已归零。请联系管理员续费后即可继续访问会员栏目。','Your membership has expired. Please contact admin to renew.')
      : T('本栏目为审批制会员内容。注册账号并通过管理员审批后即可解锁多空榜单、费率套利、KOL 共识、AI 日报与翻转倒计时。','This section is approval-gated. Register and wait for admin approval.')}</div>
    ${expired?'':'<button class="btn" id="lockLogin">'+T('登录','Sign in')+'</button>'}
    ${expired?'':'<button class="btn secondary" id="lockReg">'+T('注册（需管理员审批）','Register (approval required)')+'</button>'}
  </div>`;
}
function bindLockCard(){
  $('#lockLogin').onclick=()=>switchTab('account');
  $('#lockReg').onclick=()=>{switchTab('account');setTimeout(()=>{const f=$('#showReg');if(f)f.click()},50)};
}
</script>
<script>
'use strict';
/* ================= SVG 图表助手 ================= */
function gaugeSVG(score,min,max,opts){ // posture -5..+5 / fgi 0..100
  const o=Object.assign({size:200,label:'',color:'#d9a441'},opts||{});
  const frac=Math.max(0,Math.min(1,(score-min)/(max-min)));
  const cx=100,cy=95,r=78;
  const arc=(a0,a1,rad)=>{const p=a=>[cx+rad*Math.cos(Math.PI*(1-a)),cy-rad*Math.sin(Math.PI*(1-a))];const[x0,y0]=p(a0),[x1,y1]=p(a1);return`M ${x0} ${y0} A ${rad} ${rad} 0 0 1 ${x1} ${y1}`};
  const na=frac; // 0..1 映射半圆
  const nx=cx+r*Math.cos(Math.PI*(1-na)),ny=cy-r*Math.sin(Math.PI*(1-na));
  let ticks='';
  for(let i=0;i<=10;i++){const a=i/10,tx1=cx+(r-8)*Math.cos(Math.PI*(1-a)),ty1=cy-(r-8)*Math.sin(Math.PI*(1-a)),tx2=cx+(r-2)*Math.cos(Math.PI*(1-a)),ty2=cy-(r-2)*Math.sin(Math.PI*(1-a));ticks+=`<line x1="${tx1}" y1="${ty1}" x2="${tx2}" y2="${ty2}" stroke="#3c424d" stroke-width="1.5"/>`}
  const zoneColor=frac<0.33?'#c06a5e':frac<0.66?'#d9a441':'#5f9e7a';
  return `<svg viewBox="0 0 200 115" width="${o.size}" height="${o.size*0.575}">
    <path d="${arc(0,1,r)}" fill="none" stroke="#2a2f38" stroke-width="11" stroke-linecap="round"/>
    <path d="${arc(0,na,r)}" fill="none" stroke="${zoneColor}" stroke-width="11" stroke-linecap="round"/>
    ${ticks}
    <line x1="${cx}" y1="${cy}" x2="${nx*0.92+cx*0.08}" y2="${ny*0.92+cy*0.08}" stroke="#d8d5cd" stroke-width="2" transform="rotate(0 ${cx} ${cy})"/>
    <circle cx="${cx}" cy="${cy}" r="4" fill="#d8d5cd"/>
    <text x="18" y="112" fill="#6d6a62" font-size="9">${min}</text>
    <text x="176" y="112" fill="#6d6a62" font-size="9">${max}</text>
    <text x="100" y="112" fill="#6d6a62" font-size="8.5" text-anchor="middle">${esc(o.label)}</text>
  </svg>`;
}
function candleChartSVG(candles,opts){ // candles:[{t,o,h,l,c}]，opts.yLabel 自定义 y 轴标签

// 姿态评分 → K线（按 N 天合并，hist 需 oldest first）
function candlesFromHist(hist,n){
  const out=[];
  for(let i=0;i<hist.length;i+=n){
    const seg=hist.slice(i,i+n);
    if(!seg.length)continue;
    out.push({t:seg[0].date, o:seg[0].score, h:Math.max(...seg.map(x=>x.score)), l:Math.min(...seg.map(x=>x.score)), c:seg[seg.length-1].score});
  }
  return out;
}
function lineChartSVG(points,opts){ // points:[{x:label,y:value}] 或 [number]
  const o=Object.assign({w:640,h:200,color:'#d9a441',fill:true,yLabel:v=>v,gridN:4,xTickStep:0,xTickFmt:null,stretch:false,smooth:false,smoothTension:1,xCapacity:0},opts||{});
  // 颗粒聚合：xCapacity>0 且点数超容量 → 分段取末值（每点代表更长时间段，颗粒变大）
  const cap=o.xCapacity>0?o.xCapacity:0;
  let src=points.map(p=>typeof p==='number'?{y:p}:p);
  if(cap>0&&src.length>cap){
    const st=src.length/cap;const agg=[];
    for(let k=0;k<cap;k++){const i=Math.min(src.length-1,Math.round((k+1)*st)-1);agg.push(src[i]);}
    src=agg;
  }
  const vals=src.map(p=>p.y);
  if(!vals.length)return'<div class="empty">no data</div>';
  const autoMin=Math.min(...vals),autoMax=Math.max(...vals);
  const min=o.yMin!=null?o.yMin:autoMin,max=o.yMax!=null?o.yMax:autoMax,span=(max-min)||1;
  const pad={l:36,r:10,t:10,b:22};
  const W=o.w,H=o.h,iw=W-pad.l-pad.r,ih=H-pad.t-pad.b;
  // 左起流动：cap>0 时按容量分格（点少→曲线贴左生长，满容量→铺满并聚合变粗）；默认=点数（铺满旧行为）
  const g=(cap>0?cap:vals.length)||1;

      if(i===0){d+='M'+p1[0].toFixed(1)+' '+p1[1].toFixed(1);continue}
      if(!o.smooth||n<3){d+='L'+p1[0].toFixed(1)+' '+p1[1].toFixed(1);continue}
      const p0=xy(Math.max(0,i-1),vals[Math.max(0,i-1)]),p2=xy(Math.min(n-1,i+1),vals[Math.min(n-1,i+1)]),p3=xy(Math.min(n-1,i+2),vals[Math.min(n-1,i+2)]);
      const c1x=p1[0]+(p2[0]-p0[0])/6*t,c1y=p1[1]+(p2[1]-p0[1])/6*t;

      d+='C'+c1x.toFixed(1)+' '+c1y.toFixed(1)+' '+c2x.toFixed(1)+' '+c2y.toFixed(1)+' '+p2[0].toFixed(1)+' '+p2[1].toFixed(1)}
    if(closeBottom){d+=' L '+xy(vals.length-1,min)[0].toFixed(1)+' '+(pad.t+ih)+' L '+xy(0,min)[0].toFixed(1)+' '+(pad.t+ih)+' Z'}
    return d};
  const path=mkPath(false);
  const area=mkPath(true);
  let grid='';
  const N=o.gridN;
  for(let i=0;i<=N;i++){const v=min+span*i/N,y=pad.t+ih*(1-i/N);grid+=`<line x1="${pad.l}" y1="${y}" x2="${W-pad.r}" y2="${y}" stroke="#31363f" stroke-width="0.5"/><text x="${pad.l-5}" y="${y+3}" fill="#6d6a62" font-size="8" text-anchor="end">${esc(o.yLabel(v))}</text>`}
  // 垂直网格线 + 横轴刻度（xTickStep>0 时开启，形成框格）
  if(o.xTickStep>0&&points.length>1){
    for(let i=0;i<points.length;i++){
      if(i%o.xTickStep!==0&&i!==points.length-1)continue;
      const x=xy(i,min)[0];
      grid+=`<line x1="${x}" y1="${pad.t}" x2="${x}" y2="${pad.t+ih}" stroke="#31363f" stroke-width="0.5" stroke-dasharray="2,3"/>`;
      if(o.xTickFmt)grid+=`<text x="${x}" y="${H-6}" fill="#6d6a62" font-size="8" text-anchor="middle">${esc(o.xTickFmt(i))}</text>`;
    }
  }
  // 水平阈值参考线（hlines: [{y, color, dash, label}]）
  if(o.hlines){
    for(const hl of o.hlines){
      const hy=pad.t+ih*(1-(hl.y-min)/span);
      grid+=`<line x1="${pad.l}" y1="${hy}" x2="${W-pad.r}" y2="${hy}" stroke="${hl.color||'#6d6a62'}" stroke-width="0.8" stroke-dasharray="${hl.dash||'4,4'}" opacity="0.6"/>`;
      if(hl.label)grid+=`<text x="${W-pad.r-2}" y="${hy-2}" fill="${hl.color||'#6d6a62'}" font-size="7.5" text-anchor="end" opacity="0.8">${esc(hl.label)}</text>`;
    }
  }
  const dot=xy(vals.length-1,vals[vals.length-1]);
  // extras：叠加序列（高点连接虚线 + 标记点），与主图同坐标系
  let extrasHtml='';
  if(o.extras&&o.extras.length){
    extrasHtml=o.extras.map(function(ex){
      if(!ex.pts||ex.pts.length<1)return'';
      const n2=vals.length;
      const exPx=function(p){return[xAt(p.i),pad.t+ih*(1-(p.y-min)/span)]};
      const lift=ex.lift!=null?ex.lift:5;
      const dotSrc=ex.dots||ex.pts;

      if(ex.dotsOnly)return dots;

        const p0=exPx(ex.pts[Math.max(0,k-1)]),p2=exPx(ex.pts[Math.min(m-1,k+1)]),p3=exPx(ex.pts[Math.min(m-1,k+2)]);
        const c1x=p1[0]+(p2[0]-p0[0])/6*t,c1y=(p1[1]-lift)+((p2[1]-lift)-(p0[1]-lift))/6*t;
        const c2x=p2[0]-(p3[0]-p1[0])/6*t,c2y=(p2[1]-lift)-((p3[1]-lift)-(p1[1]-lift))/6*t;
        d+='C'+c1x.toFixed(1)+' '+c1y.toFixed(1)+' '+c2x.toFixed(1)+' '+c2y.toFixed(1)+' '+p2[0].toFixed(1)+' '+(p2[1]-lift).toFixed(1);
      }
      return '<path d="'+d+'" fill="none" stroke="'+(ex.color||'#e0533d')+'" stroke-width="1.2" stroke-dasharray="4,3" opacity="0.85"/>'+dots;
    }).join('');
  }
  const svg=`<svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="xMidYMid meet" style="${o.stretch?'min-width:'+W+'px;display:block;':'max-height:'+(H+20)+'px;'}">
    ${grid}
    ${o.fill?`<path d="${area}" fill="${o.color}" opacity="0.12"/>`:''}
    ${extrasHtml}
    <path d="${path}" fill="none" stroke="${o.color}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${dot[0]}" cy="${dot[1]}" r="3" fill="${o.color}"/>

  </svg>`;
  return o.stretch?`<div style="overflow-x:auto;padding-bottom:2px">${svg}</div>`:svg;
}
function barChartSVG(items,opts){ // items:[{label,value,color?}]
  const o=Object.assign({w:640,h:220,color:'#d9a441'},opts||{});
  if(!items.length)return'<div class="empty">no data</div>';
  const pad={l:8,r:8,t:14,b:26},W=o.w,H=o.h,iw=W-pad.l-pad.r,ih=H-pad.t-pad.b;
  const maxAbs=Math.max(...items.map(i=>Math.abs(i.value)),1);
  const zeroY=pad.t+ih*(items.some(i=>i.value<0)?maxAbs/(2*maxAbs):1);
  const scale=v=>ih*(Math.abs(v)/(2*maxAbs));
  const bw=Math.min(28,iw/items.length*0.62);
  let bars='',labels='';
  items.forEach((it,i)=>{
    const x=pad.l+iw*(i+0.5)/items.length-bw/2;
    const h=scale(it.value);
    const y=it.value>=0?zeroY-h:zeroY;
    const c=it.color||(it.value>=0?'var(--up)':'var(--down)');
    bars+=`<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(h,1)}" fill="${c}" opacity="0.8" rx="2"/>
      <text x="${x+bw/2}" y="${it.value>=0?y-4:y+h+11}" fill="${c}" font-size="8.5" text-anchor="middle">${esc(String(it.value))}</text>`;
    labels+=`<text x="${x+bw/2}" y="${H-8}" fill="#6d6a62" font-size="8" text-anchor="middle">${esc(it.label)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="xMidYMid meet" style="max-height:${H+20}px">
    <line x1="${pad.l}" y1="${zeroY}" x2="${W-pad.r}" y2="${zeroY}" stroke="#3c424d" stroke-width="1"/>
    ${bars}${labels}
  </svg>`;
}

function kbMd(t){
  t=String(t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const blocks=t.split(/```/);let html='';
  for(let i=0;i<blocks.length;i++){const b=blocks[i];
    if(i%2===1){html+='<pre class="kb-code">'+b+'</pre>';continue;}
    html+=b.split(/\n/).map(ln=>{
      ln=ln.trim();if(!ln)return'';
      if(/^#{1,4}\s/.test(ln)){const m=ln.match(/^(#+)\s*(.*)/);const tag='h'+(m[1].length+3);return'<'+tag+' class="kb-h">'+m[2]+'</'+tag+'>';}
      if(/^[-*]\s/.test(ln))return'<div class="kb-li">• '+ln.replace(/^[-*]\s/,'')+'</div>';
      if(/^\d+\.\s/.test(ln))return'<div class="kb-li">'+ln+'</div>';
      if(/^\|/.test(ln))return'<div class="kb-tbl">'+ln.replace(/\|/g,' │ ')+'</div>';
      ln=ln.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`(.+?)`/g,'<code>$1</code>');
      return'<div class="kb-p">'+ln+'</div>';
    }).join('');
  }
  return html;
}
function kbHl(h,q){
  const escq=q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').split(/\s+/).filter(Boolean).join('|');
  if(!escq)return h;
  return h.replace(new RegExp('('+escq+')','gi'),'<em>$1</em>');
}

function kbRenderShell(){

function fmtDate(ts){
  // 统一用 Asia/Shanghai 时区，避免服务器/浏览器时区差异导致时间错位
  const d=new Date(ts);
  const now=new Date();
  const diff=now-d;
  if(diff<60000)return `${T('刚刚','just now')}`;
  if(diff<3600000)return Math.floor(diff/60000)+`${T('分钟前','m ago')}`;
  if(diff<86400000)return Math.floor(diff/3600000)+`${T('小时前','h ago')}`;
  const parts=new Intl.DateTimeFormat('zh-CN',{hour12:false,timeZone:'Asia/Shanghai',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).formatToParts(d);
  const g=p=>{const x=parts.find(q=>q.type===p);return x?x.value:''};
  const mm=g('month'),dd=g('day'),hh=g('hour'),mi=g('minute');
  const shYear=new Date(ts+8*3600*1000).getUTCFullYear();
  const nowYear=new Date(Date.now()+8*3600*1000).getUTCFullYear();
  if(shYear===nowYear)return mm+"/"+dd+" "+hh+":"+mi;
  return shYear+"/"+mm+"/"+dd+" "+hh+":"+mi;
}

      +`<div style="display:flex;justify-content:space-between;font-size:9px;color:var(--text3);margin-top:2px"><span>${T('避险','Fear')} 0</span><span>50</span><span>100 ${T('贪婪','Greed')}</span></div>`
      +'</div>'
      +`<div style="font-size:10.5px;color:var(--text3);max-width:300px">${T('10 大经典指标加权合成 · 真实数据+历史阈值判定 · 非 AI 生成','10 classic indicators · real data')}</div>`
      +'</div></div>';
    // 📊 10 大指标显示条
    h+='<div class="card" style="padding:12px 14px"><div class="card-title">📊 '+T('10 大经典市场指标','10 Market Indicators')+'</div>';
    const order=['cnn_fng','VIXCLS','BAMLH0A0HYM2','T10Y2Y','DTWEXBGS','WALCL','M2_YOY','STABLECOIN','WIDTH50','BTC_QQQ'];
    for(const id of order){

      if(!x)continue;
      if(x.error){h+=`<div style="display:flex;justify-content:space-between;padding:7px 4px;border-bottom:1px solid var(--line);font-size:11.5px"><span>${esc(x.name)}</span><span style="color:var(--text3)">${esc(x.error)}</span></div>`;continue;}
      const sc=x.score!=null?x.score:50;

      const trendA=x.trend==null?'':x.trend>0?'<span style="color:var(--up)">▲</span>':x.trend<0?'<span style="color:var(--down)">▼</span>':'<span style="color:var(--text3)">—</span>';
      h+=`<div style="padding:9px 4px;border-bottom:1px solid var(--line)">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px">
          <span style="font-size:12.5px;font-weight:700">${esc(x.name)} ${trendA}</span>
          <span style="font-family:var(--mono);font-size:14px;font-weight:800;color:${col}">${x.value}${x.unit?(' '+esc(x.unit)):''}</span>
          <span style="font-size:10px;padding:2px 8px;border-radius:10px;background:${col}22;color:${col};border:1px solid ${col}55">${esc(x.state||'')}</span>
        </div>
        <div style="height:7px;background:var(--bg0);border-radius:4px;margin:5px 0;overflow:hidden"><div style="width:${sc}%;height:100%;border-radius:4px;background:${col}"></div></div>
        <div style="display:flex;justify-content:space-between;gap:10px;font-size:10.5px;color:var(--text3);flex-wrap:wrap">
          <span style="flex:1;min-width:200px">${esc(x.signal||'')}</span>
          <span style="font-family:var(--mono);flex-shrink:0">${x.prev!=null?('prev '+x.prev+(x.unit||'')):''}${x.hist&&x.hist.week!=null?(' · 1周 '+x.hist.week+' · 1月 '+x.hist.month):''}</span>
        </div></div>`;
    }
    h+='</div>';
    main.innerHTML=h;
    // 📈 收益率曲线（宏观背景）
    api('/api/macro/curve').then(cv=>{
      if(!cv||!cv.ok||!cv.points||cv.points.length<2)return;
      const pts=cv.points.filter(p=>p.label!=='FFR');
      if(pts.length<2)return;
      const W=520,H=170,padL=34,padB=26,padT=14;
      const vals=pts.map(p=>p.value);
      const mn=Math.min(...vals)-0.15,mx=Math.max(...vals)+0.15;
      const px=pts.map((p,i)=>({x:padL+i*(W-padL-10)/Math.max(1,pts.length-1),y:padT+(H-padB-padT)*(1-(p.value-mn)/(mx-mn||1))}));
      const path=px.map((p,i)=>(i?'L':'M')+p.x.toFixed(1)+' '+p.y.toFixed(1)).join(' ');
      const box=document.createElement('div');box.className='card';
      box.innerHTML='<div class="card-title">📈 '+T('美债收益率曲线（FRED 官方）','Treasury Curve')+'</div>'
        +`<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:560px"><path d="${path}" stroke="#d9a441" stroke-width="1.8" fill="none"/>`
        +px.map(p=>`<circle cx="${p.x}" cy="${p.y}" r="3" fill="#d9a441"/>`).join('')
        +px.map(p=>`<text x="${p.x}" y="${H-padB+14}" fill="#8a8f98" font-size="9" text-anchor="middle">${p.label}</text>`).join('')
        +px.map(p=>`<text x="${p.x}" y="${p.y-7}" fill="#e8e8e8" font-size="9.5" text-anchor="middle" font-family="monospace">${p.value.toFixed(2)}</text>`).join('')
        +'</svg>';
      main.appendChild(box);
    }).catch(()=>{});
  }catch(e){
    main.innerHTML='<div class="card">'+esc(T('异常','Error'))+': '+esc(e.message)+'</div>';
  }
};


function showKLModal(title,symbol,bars){
  const ov=document.createElement('div');
  ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:99;display:flex;align-items:center;justify-content:center';
  const W=700,H=340;
  const closes=bars.filter(b=>b.c!=null).map(b=>b.c);
  const mn=Math.min(...closes),mx=Math.max(...closes);
  const pts=closes.map((c,i)=>({x:30+i*(W-60)/Math.max(1,closes.length-1),y:H-30-(c-mn)/(mx-mn||1)*(H-70)}));
  const path=pts.map((p,i)=>(i?'L':'M')+p.x.toFixed(1)+' '+p.y.toFixed(1)).join(' ');
  const last=closes[closes.length-1],first=closes[0];
  const chg=first?((last-first)/first*100):0;
  const col=chg>=0?'#5f9e7a':'#c06a5e';
  ov.innerHTML=`<div style="background:var(--bg1);border:1px solid var(--line);border-radius:12px;width:740px;max-width:92vw;padding:16px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <div style="font-weight:800">${esc(title)} <span style="color:var(--text3);font-size:11px">${esc(symbol)}</span></div>
      <div style="font-size:15px;font-weight:800;color:${col}">${fmt(last)} ${chg>=0?'+':''}${chg.toFixed(2)}%</div>
    </div>
    <svg width="${W}" height="${H}" style="background:var(--bg0);border-radius:8px;width:100%">
      <path d="${path}" stroke="${col}" stroke-width="1.8" fill="none"/>
      <text x="30" y="18" fill="#8a8f98" font-size="10">${fmt(mx,0)}</text>
      <text x="30" y="${H-12}" fill="#8a8f98" font-size="10">${fmt(mn,0)}</text>
    </svg>
    <div style="text-align:right;margin-top:6px;font-size:11px;color:var(--text3)">${T('近30日走势 · 点击空白关闭','30d trend · click outside to close')}</div>
  </div>`;
  ov.onclick=()=>document.body.removeChild(ov);
  document.body.appendChild(ov);
}

function lsrTable(rows,mode){
  if(!rows||!rows.length)return'<div class="empty">暂无数据，等待采集</div>';
  const body=rows.map(c=>{
    const ratio=mode==='whale'?(c.whale_ratio??c.ratio):(c.trader_ratio??c.ratio);
    const d2m=mode==='whale'?(c.whale_delta_2m??c.delta_2m):c.delta_2m;
    const d4h=mode==='whale'?(c.whale_delta_4h??c.delta_4h):(c.trader_delta_4h??c.delta_4h);
    return `<tr><td class="num">${c.rank??''}</td><td>${esc(c.symbol)}</td>
      <td class="num ${cls((ratio||1)-1)}">${ratio!=null?Number(ratio).toFixed(2):'—'}</td>
      <td class="num ${cls(d2m)}">${d2m!=null?fmtPct(d2m*100):'—'}</td>
      <td class="num ${cls(d4h)}">${d4h!=null?fmtPct(d4h*100):'—'}</td>
      <td class="num">${c.oi_mcap_ratio!=null?(c.oi_mcap_ratio*100).toFixed(1)+'%':'—'}</td></tr>`;
  }).join('');
  return `<div style="overflow-x:auto"><table><thead><tr><th>#</th><th>${T('币种','Symbol')}</th><th>${T('多空比','L/S Ratio')}</th><th>Δ2m</th><th>Δ4h</th><th>OI/MCap</th></tr></thead><tbody>${body}</tbody></table></div>`;
}

  main.innerHTML='<div class="card">'+T('加载中…','Loading…')+'</div>';
  const d=await api('/api/member/consensus');
  if(d.__needLogin){state.user=null;switchTab('consensus');return}
  const cards=(d.coins||[]).map(c=>{
    const bias=c.trust_adjusted_bias||0;
    return `<div class="coin-card">
      <div class="coin-head"><span class="coin-sym">${esc(c.symbol)}</span>
        <span class="badge ${c.decision==='long'?'bullish':c.decision==='short'?'bearish':'neutral'}">${esc(c.decision_label||c.decision||'—')}</span></div>
      <div class="coin-price num">${fmtPrice(c.price)}</div>
      <div class="conf-bar"><div class="conf-fill" style="width:${Math.round((c.confidence||0)*100)}%;background:${c.decision==='long'?'var(--up)':c.decision==='short'?'var(--down)':'#d9a441'}"></div></div>
      <div class="data-ts">confidence ${Math.round((c.confidence||0)*100)}% · bias <span class="${cls(bias)}">${bias>=0?'+':''}${bias.toFixed(3)}</span></div>
      <div class="coin-headline" style="margin-top:8px">${(c.top_factors||[]).map(f=>`· ${esc(f.name||f.id)}（${f.score>=0?'+':''}${f.score}）`).join('<br>')||'—'}</div>
      <div class="coin-official">${T('快照','snapshot')} ${esc(c.snapshot_date||'—')} · ${c.snapshot_age_hours!=null?Number(c.snapshot_age_hours).toFixed(0)+'h ago':''}</div>
    </div>`;
  }).join('');
  main.innerHTML=`<div class="card">
    <div class="card-title">${T('KOL 中期共识信号','KOL Mid-term Consensus Signals')}
      <span style="margin-left:auto">${dataTsHtml(d.data_ts,d.stale)}</span></div>
    <div class="coin-grid">${cards||'<div class="empty">'+T('暂无数据','No data')+'</div>'}</div></div>'`;
};

/* ================= PANEL: 留言板 ================= */
PANELS.messages=async function(){
  const main=$('#main');
  const loggedIn=!!state.user;
  // 头像色板：按用户名 hash 稳定选色
  const AVATAR_COLORS=['#d9a441','#5f9e7a','#7c4dff','#c06a5e','#4d9dd9','#d96a5e','#5ec4a4','#b8862f','#8a7cff','#e07b54','#4db8b8','#c94da0'];
  const nameHash=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))>>>0;return h};
  const avatarHtml=name=>{
    const color=AVATAR_COLORS[nameHash(name)%AVATAR_COLORS.length];
    const ch=String(name||'?').slice(0,1).toUpperCase();
    return `<div class="msg-avatar" style="background:${color}">${esc(ch)}</div>`;
  };
  const loadList=async()=>{
    const d=await api('/api/messages?limit=100');
    const list=$('#msgList');
    if(!d||!d.ok){list.innerHTML='<div class="msg-empty">加载失败</div>';return}
    const msgs=(d.messages||[]);
    if(!msgs.length){list.innerHTML='<div class="msg-empty">'+T("还没有留言，来抢沙发~","No messages yet, be the first!")+'</div>';return}
    list.innerHTML=msgs.map(m=>{
      const vipHtml=vipBadge(m.vip);
      const canDel=state.admin||(state.user&&state.user.id===m.user_id);
      const displayName=m.nickname||m.username;
      return `<div class="msg-item">${avatarHtml(displayName)}
        <div class="msg-body">
          <div class="msg-head"><span class="msg-user">${esc(displayName)}</span>${m.nickname?'<span class="msg-time">@'+esc(m.username)+'</span>':''}${vipHtml}<span class="msg-time">${fmtTs(Math.floor(m.created_at/1000))}</span>${canDel?'<span class="msg-del" data-id="'+m.id+'">删除</span>':''}</div>
          <div class="msg-content">${esc(m.content)}</div>
        </div></div>`;
    }).join('');
    $$('#msgList .msg-del').forEach(b=>b.onclick=async()=>{
      if(!confirm(T('删除这条留言？','Delete this message?')))return;
      const r=await api('/api/messages/'+b.dataset.id,{method:'DELETE'});
      if(r.ok){toast(T('已删除','Deleted'));loadList()}else toast(r.error||'failed');
    });
  };
  // 渲染
  const composer=loggedIn
    ? `<div class="msg-composer">
        <textarea id="msgInput" maxlength="500" placeholder="${T('写下你的观点…','Share your thoughts…')}"></textarea>
        <div class="msg-bar">
          <span class="msg-count" id="msgCount">0/500 · ${T('每日限 5 条','5/day')}</span>
          <button class="btn small" id="msgSend">${T('发布','Post')}</button>
        </div></div>`
    : `<div class="msg-login-hint">🔒 ${T('登录后才能留言','Login required to post')} — <b>${T('去登录','Login')}</b> → <a href="#" id="msgGoLogin">${T('登录/注册','Login / Register')}</a></div>`;
  main.innerHTML=`<div class="card"><div class="card-title">💬 ${T('留言板 · 大家怎么说','Messages Board')} <span class="data-ts">${T('每日每人 5 条','5 per user per day')}</span></div>${composer}<div class="msg-list" id="msgList"><div class="msg-empty">${T('加载中…','Loading…')}</div></div></div>`;
  if(loggedIn){
    $('#msgInput').oninput=()=>{const n=$('#msgInput').value.length;$('#msgCount').textContent=n+'/500 · '+T('每日限 5 条','5/day');};
    $('#msgSend').onclick=async()=>{
      const content=$('#msgInput').value.trim();
      if(!content){toast(T('写点什么吧','Type something'));return}
      const r=await api('/api/messages',{method:'POST',body:JSON.stringify({content})});
      if(r.ok){$('#msgInput').value='';$('#msgCount').textContent='0/500';toast(T('已发布','Posted'));loadList()}
      else if(r.__needLogin){toast(T('请先登录','Login first'));switchTab('account')}
      else toast(r.message||r.error||T('发布失败','Failed'));
    };
  }else{
    const gl=$('#msgGoLogin');
    if(gl)gl.onclick=e=>{e.preventDefault();switchTab('account')};
  }
  loadList();
};

PANELS.countdown=async function(){startTabTimer('countdown',PANELS.countdown);
  const main=$('#main');
  main.innerHTML='<div class="card">'+T('加载中…','Loading…')+'</div>';
  const d=await api('/api/member/countdown');
  if(d.__needLogin){state.user=null;switchTab('countdown');return}
  const cd=d.countdown,p=d.posture;
  const moveZh={done:'已达成',closer:'接近中',none:'无进展'};
  const conds=(cd.conditions||[]).map(c=>{
    const pct=Math.round((c.progress||0)*100);
    const col=c.today_move==='done'?'#5f9e7a':c.today_move==='closer'?'#d9a441':'#6d6a62';
    return `<div class="cond-card">
      <div class="cond-head"><span class="cond-label">${esc(state.lang==='zh'?c.label_zh:c.label_en)}</span>
        <span class="cond-bucket" style="color:${col}">${esc(c.distance_bucket||'')} · ${esc(moveZh[c.today_move]||c.today_move)}</span></div>
      <div class="cond-line">${esc(state.lang==='zh'?c.line_zh:c.line_en)}</div>
      <div class="progress"><div class="progress-fill" style="width:${pct}%;${c.today_move==='done'?'background:#5f9e7a':''}"></div></div>
      <div class="data-ts">${pct}%</div>
    </div>`;
  }).join('');
  const off=(cd.official||[]).map(c=>`<tr><td>${esc(c.label_zh||c.key)}</td><td>${esc(c.line_zh||'')}</td><td class="num">${esc(c.distance_bucket||'')}</td><td class="num">${esc(c.today_move||'')}</td></tr>`).join('');
  main.innerHTML=`<div class="card">
    <div class="card-title">${T('翻转条件倒计时','Flip Condition Countdown')}
      <span style="margin-left:auto">${dataTsHtml(d.data_ts,d.stale)}</span></div>
    <div class="kv-strip">
      <span>${T('当前姿态','posture')} <b>${esc(p.state)} ${p.score>0?'+':''}${p.score}</b></span>
      <span>${T('已维持','held')} <b>${p.days_held}d</b></span>
      <span>${T('目标状态','target')} <b>${esc(cd.target_state)}</b></span>
      <span>${T('总体进度','overall')} <b>${Math.round((cd.overall_progress||0)*100)}%</b></span>
    </div>
    <div class="verdict-block" style="margin-bottom:14px">${esc(cd.note_zh||'')}</div>
    ${conds}
  </div>
  ${off?`<div class="card"><div class="card-title">${T('William countdown 对照','William Countdown')}</div>
    <div style="overflow-x:auto"><table><thead><tr><th>${T('条件','Cond')}</th><th>${T('描述','Line')}</th><th>${T('距离','Distance')}</th><th>${T('今日动向','Move')}</th></tr></thead><tbody>${off}</tbody></table></div></div>`:''}`;
};

function vipBadge(v){
  if(!v)return '';
  const cfg={
    owner:{icon:'👑',cls:'vip-owner',text:'老板',sub:'无限'},
    eternal:{icon:'💎',cls:'vip-eternal',text:'至尊',sub:'永久'},
    gold:{icon:'★',cls:'vip-gold',text:'黄金',sub:v.desc||''},
    platinum:{icon:'◆',cls:'vip-platinum',text:'白金',sub:v.desc||''},
    normal:{icon:'●',cls:'vip-normal',text:'普通',sub:v.desc||''},
    expired:{icon:'○',cls:'vip-expired',text:'到期',sub:'额度已归零'}
  };
  const c=cfg[v.level]||cfg.normal;
  const body=(v.level==='owner'||v.level==='eternal')?c.text:(c.text+' '+c.sub.replace(' 天','天'));
  return '<span class="vip-badge '+c.cls+'" title="'+c.text+' · '+c.sub+'">'+c.icon+' '+body+'</span>';
}
function vipHero(v){
  if(!v)return '';
  const cfg={
    owner:{icon:'👑',cls:'vip-owner',text:'老板',sub:'无限',tip:'尊贵的老板，欢迎回来'},
    eternal:{icon:'💎',cls:'vip-eternal',text:'至尊会员',sub:'永久',tip:'永久尊享全部会员权益'},
    gold:{icon:'🌟',cls:'vip-gold',text:'黄金会员',sub:v.desc||'',tip:'黄金尊享 · 90 天以上权益'},
    platinum:{icon:'💠',cls:'vip-platinum',text:'白金会员',sub:v.desc||'',tip:'白金尊享 · 30 天以上权益'},
    normal:{icon:'✨',cls:'vip-normal',text:'普通会员',sub:v.desc||'',tip:'会员权益生效中'},
    expired:{icon:'⏳',cls:'vip-expired',text:'会员已到期',sub:'额度已归零',tip:'请联系管理员续费'}
  };
  const c=cfg[v.level]||cfg.normal;
  return '<div class="card vip-hero" style="background:linear-gradient(135deg,var(--bg1),var(--bg2));border:1px solid var(--line)">'
    +'<span style="font-size:26px">'+c.icon+'</span>'
    +'<div><div class="vip-title">'+c.text+'</div>'
    +'<div class="vip-meta">'+c.sub+(v.expires_at?' · 到期 '+new Date(v.expires_at).toLocaleString('zh-CN',{hour12:false}):'')+'</div></div>'
    +'<span class="vip-badge '+c.cls+'" style="margin-left:auto">'+c.text+'</span></div>';
}
function refreshUserChip(){
  const chip=$('#userChip');
  const vchip=$('#vipChip');
  if(state.admin){
    chip.style.display='';chip.className='user-chip vip-chip-owner';chip.innerHTML='👑 老板·无限';
    vchip.style.display='none';
    return;
  }
  if(state.user){
    chip.style.display='';chip.className='user-chip';
    chip.innerHTML='◆ '+esc(state.user.nickname||state.user.username);
    vchip.style.display='';vchip.innerHTML=vipBadge(state.user.vip);
  }else{
    chip.style.display='none';vchip.style.display='none';
  }
}

PANELS.live=async function(){startTabTimer('live',PANELS.live);
  const main=$('#main');
  main.innerHTML='<div class="card">'+T('加载中…','Loading…')+'</div>';
  const d=await api('/api/live/stats');
  if(d.__needLogin){state.user=null;switchTab('live');return}
  if(!d.ok){main.innerHTML='<div class="card"><div class="empty">'+T('数据不可用','Unavailable')+'</div></div>';return}
  const k=d.kpi||{};
  const fmtP=v=>v==null?'—':(v>=0?'+':'')+Number(v).toFixed(2)+'%';
  const fmtN=v=>v==null?'—':Number(v).toFixed(2);
  const fmtPx=v=>{if(v==null)return'—';v=Number(v);if(v===0)return'0';const d=v>=1?2:v>=0.01?5:v>=0.0001?8:10;return v.toFixed(d);};
  
  const fmtU=v=>v==null?'—':(v>=0?'+':'')+Number(v).toFixed(2)+'u';
  // 资金曲线（1000u 复利，含持仓浮盈）
  // 资金曲线：15分钟计点 · 从左开始流动（不平铺，>120点自动变粗）· 1000基准居中
  const eqRaw=(d.equityCurve||[]).map(p=>({x:p.label,y:p.y}));
  const eqBase=1000;
  const eqSpread=Math.max(3, Math.ceil(Math.max.apply(null, eqRaw.map(p=>Math.abs(p.y-eqBase)))));
  const eqChart=eqRaw.length>1?lineChartSVG(eqRaw,{
    color:'#26A69A', yLabel:v=>v.toFixed(0)+'u',
    yMin:eqBase-eqSpread, yMax:eqBase+eqSpread,   // 1000 正好在垂直正中间
    gridN:4, smooth:true, smoothTension:0.6,
    xCapacity:120,                                 // 曲线从左开始，点数超120颗粒自动变粗
    hlines:[{y:1000,color:'#8a8f98',dash:'3,4',label:'本金 1000u'}]
  }):'<div class="empty">'+T('暂无数据','No data')+'</div>';
  // 指标卡生成器
  const kpiCard=(icon,label,val,cls)=>
    '<div style="flex:1;min-width:120px;background:var(--bg1);border:1px solid var(--line);border-radius:10px;padding:10px 12px">'
    +'<div style="font-size:11px;color:var(--text3);margin-bottom:4px">'+icon+' '+label+'</div>'
    +'<div class="'+cls+'" style="font-size:18px;font-weight:700">'+val+'</div></div>';
  const upCls=v=>v>=0?'up':'down';
  // 策略分布
  const stratRows=Object.entries(k.strategyBreakdown||{}).map(([name,v])=>{
    const settledN=(v.wins||0)+(v.losses||0);
    const wr=settledN>0?(v.wins/settledN*100).toFixed(0)+'%':'—';
    const openN=(v.total||0)-settledN;
    return '<tr><td>'+esc(name)+'</td><td class="num">'+(v.total||0)+'</td><td class="num">'+settledN+'</td><td class="num">'+(v.wins||0)+'</td><td class="num">'+(v.losses||0)+'</td><td class="num">'+(openN>0?openN+'⏳':'0')+'</td><td class="num">'+wr+'</td><td class="num '+(openN>0&&settledN===0?'':'')+'" style="color:'+(openN>0&&settledN===0?'var(--text3)':'')+'">'+(settledN>0?fmtP(v.pnlLev):'未结算')+'</td></tr>';
  }).join('')||'<tr><td colspan="8" class="empty">暂无</td></tr>';
  // 单子明细（含持仓浮动盈亏）
  const tradeRows=(d.trades||[]).map(t=>{

async function boot(){
  renderNav();

  const tick=()=>{$('#clock').textContent=new Date().toLocaleTimeString('zh-CN',{hour12:false,timeZone:'Asia/Shanghai'})+' CST'};

  // 指纹
  const v=await api('/api/version');
  if(v.ok)$('#fp').textContent=`${v.name}@${v.version} sha:${v.dashboard_html.sha256_16} ${v.dashboard_html.bytes}B full:${v.dashboard_html.is_full_terminal}`;
  // 会话恢复（会员与后台互不影响）
  const me=await api('/api/auth/me');
  if(me.ok&&me.user&&me.user.status==='approved'){state.user=me.user;
    renderNav();}
  refreshUserChip();
  const ah=await api('/api/admin/users?status=pending');
  if(!ah.__needAdmin&&ah.ok)state.admin=true;
  // 涨跌配色切换（绿涨红跌 ↔ 红涨绿跌）
  (function(){
    var saved=null;try{saved=localStorage.getItem('w1_color_flip')}catch(e){}
    if(saved==='1')document.body.classList.add('cn-flip');
    var btn=$('#colorBtn');
    if(btn)btn.onclick=function(){
      document.body.classList.toggle('cn-flip');
      var on=document.body.classList.contains('cn-flip');
      try{localStorage.setItem('w1_color_flip',on?'1':'0')}catch(e){}
      if(on)btn.title='涨跌配色：红涨绿跌（点击切回）';else btn.title='涨跌配色：绿涨红跌（点击切换）';
      // 重绘当前 tab 使动态渲染的颜色立即生效
      switchTab(state.tab);
    };
  })();
  // 语言切换
  $('#langBtn').onclick=()=>{state.lang=state.lang==='zh'?'en':'zh';$('#langBtn').textContent=state.lang==='zh'?'EN':'中';renderNav();switchTab(state.tab)};
  $('#langBtn').textContent='EN';
  switchTab('overview');
  initTableAutoFix();
}
/* ---- 表格溢出自动化处理：监听渲染，自动给所有 <table> 包横向滚动容器 ---- */
function autoWrapTables(root){
  var tables=root.querySelectorAll('table');
  for(var i=0;i<tables.length;i++){
    var t=tables[i];
    // 已在滚动容器内则跳过；已经包过则跳过
    if(t.__wrapped||t.closest('.table-scroll')||t.parentElement&&t.parentElement.style&&t.parentElement.style.overflowX==='auto')continue;
    var w=document.createElement('div');
    w.className='table-scroll';
    t.parentNode.insertBefore(w,t);
    w.appendChild(t);
    t.__wrapped=true;
  }
}
function initTableAutoFix(){
  var main=document.getElementById('main');
  if(!main||main.__tableObs)return;
  main.__tableObs=true;
  autoWrapTables(main);
  new MutationObserver(function(){autoWrapTables(main)}).observe(main,{childList:true,subtree:true});
}
