<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="William 量化看板 W1 — William 运算核心：每日判断、姿态评分、8币立场、情绪、资金流、多空LSR、费率套利、KOL共识、AI日报、翻转倒计时，审批制会员系统。">
<title>William 量化看板 W1</title>
<style>
/* ============ William 量化看板 W1 · 深色量化终端（低饱和） ============ */
:root{
  --bg0:#14161a; --bg1:#1b1e24; --bg2:#22262d; --bg3:#2a2f38;
  --line:#31363f; --line2:#3c424d;
  --amber:#d9a441; --amber-dim:#8a6c30; --amber-soft:rgba(217,164,65,.12);
  --text:#d8d5cd; --text2:#9d998f; --text3:#6d6a62;
  --green:#5f9e7a; --green-soft:rgba(95,158,122,.14);
  --red:#c06a5e; --red-soft:rgba(192,106,94,.14);
  --yellow:#c9a24d;
  /* 涨跌配色：默认绿涨红跌；body.cn-flip 时红涨绿跌 */
  --up:var(--green); --down:var(--red);
  --up-soft:var(--green-soft); --down-soft:var(--red-soft);
  --serif:"Iowan Old Style","Palatino Linotype","Book Antiqua",Georgia,"Songti SC","SimSun",serif;
  --mono:"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:-apple-system,"Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg0);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.6;min-height:100vh}
a{color:var(--amber);text-decoration:none}
a:hover{text-decoration:underline}
::selection{background:var(--amber-dim);color:#fff}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:var(--bg0)}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:4px}
/* ---- 姿态评分速度表 ---- */
@keyframes slideUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes needleSweep{from{transform:rotate(-90deg)}to{transform:rotate(var(--needle-deg,0deg))}}
@keyframes countUp{from{opacity:0}to{opacity:1}}
/* ---- 全局页面入场动画（所有选项卡统一） ---- */
#main>*{animation:mainIn .35s ease-out}
@keyframes mainIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@media (prefers-reduced-motion: reduce){#main>*{animation:none}}

.posture-dashboard{display:grid;grid-template-columns:0.52fr 1.75fr;gap:14px;animation:slideUp .6s ease-out}
.posture-gauge{background:var(--bg1);border-radius:8px;padding:12px 10px 14px;display:flex;flex-direction:column;align-items:center;justify-content:center;animation:slideUp .6s ease-out .1s both}
.posture-gauge svg{width:100%;max-width:190px;height:auto}
.gauge-score-text{font-size:32px;font-weight:700;line-height:1;margin-top:-12px;font-family:var(--mono)}
.gauge-state-text{font-size:13px;font-weight:500;opacity:.8;margin-top:3px}
.gauge-sub{font-size:10px;color:var(--text3);margin-top:5px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.gauge-sub span{background:var(--bg2);padding:3px 10px;border-radius:4px}
.posture-chart{background:var(--bg1);border-radius:8px;padding:12px 16px 16px;display:flex;flex-direction:column;animation:slideUp .6s ease-out .2s both}
.posture-chart .chart-title{font-size:12px;color:var(--text3);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.posture-chart .chart-box{flex:1;min-height:250px}
.tf-bar{display:flex;gap:4px;margin:0 0 6px auto}
.tf-btn{font-size:10px;line-height:1;padding:3px 8px;border-radius:4px;border:1px solid var(--line);background:var(--bg2);color:var(--text3);cursor:pointer;transition:all .15s}
.tf-btn:hover{color:var(--text1);border-color:var(--accent)}
.tf-btn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.factor-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.factor-item{background:var(--bg2);padding:6px 10px;border-radius:4px;display:flex;justify-content:space-between;align-items:center;font-size:11px}
.factor-item .fl{color:var(--text3)}
.factor-item .fv{font-weight:600;font-family:var(--mono);font-size:12px}
.factor-item .fv.pos{color:var(--up)}
.factor-item .fv.neg{color:var(--down)}
.factor-item .fv.zero{color:var(--text3)}

/* ---- OpenClue \u6bcf\u65e5\u6458\u8981 ---- */
.hero-brief{background:var(--bg1);border-radius:8px;padding:16px;margin-bottom:12px;animation:slideUp .5s ease-out both}
.hero-brief .hb-headline{font-size:15px;font-weight:600;line-height:1.5;margin-bottom:8px}
.hero-brief .hb-quote{font-size:13px;line-height:1.7;color:var(--text2)}
.hero-brief .hb-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;font-size:11px;color:var(--text3)}
.hero-brief .hb-pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.hero-brief .hb-pill{font-size:10px;padding:2px 8px;border-radius:4px;border:1px solid var(--line2)}
.hero-brief .hb-pill.bullish{border-color:var(--up);color:var(--up)}
.hero-brief .hb-pill.bearish{border-color:var(--down);color:var(--down)}
.hero-brief .hb-pill.cautious,.hero-brief .hb-pill.mixed{border-color:#d9a441;color:var(--yellow)}
.hero-brief .hb-pill.neutral{border-color:var(--text3);color:var(--text3)}
.hero-brief .hb-history{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.hero-brief .hb-history-item{font-size:10px;color:var(--text3);padding:3px 8px;border-radius:4px;background:var(--bg2);cursor:pointer;transition:background .2s}
.hero-brief .hb-history-item:hover{background:var(--bg3)}


/* ---- 顶栏 ---- */
.topbar{border-bottom:1px solid var(--line);background:linear-gradient(180deg,#191c21,#14161a);position:sticky;top:0;z-index:50}
.topbar-inner{max-width:1280px;margin:0 auto;padding:14px 20px 10px}
.brand-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;font-family:var(--serif);font-size:22px;letter-spacing:.5px;color:var(--amber);text-shadow:0 0 14px rgba(217,164,65,.35),0 0 2px rgba(217,164,65,.2)}
.brand em{font-style:normal;color:#f2da92}
.brand-logo{width:36px;height:36px;flex:none;filter:drop-shadow(0 2px 8px rgba(217,164,65,.28))}
.brand-sub{font-family:var(--mono);font-size:11px;color:var(--text3);letter-spacing:1px;text-transform:uppercase}
.top-actions{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.clock{font-family:var(--mono);font-size:12px;color:var(--text2)}
@media(max-width:860px){.clock{display:none}.user-chip .vip-badge{font-size:9.5px;padding:0 6px}}
.lang-btn,.ghost-btn{background:var(--bg2);border:1px solid var(--line2);color:var(--text2);font-size:12px;padding:5px 12px;border-radius:4px;cursor:pointer;font-family:var(--sans);transition:.15s}.oi-g{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}.oi-i{background:var(--bg2);border-radius:6px;padding:8px 10px}.oi-l{font-size:11px;color:var(--text3);margin-bottom:2px}.oi-v{font-size:15px;font-weight:600;font-family:var(--mono)}.oi-bar-wrap{display:flex;align-items:center;gap:10px;margin:6px 0}.oi-bar{flex:1;height:16px;border-radius:8px;background:#1a1c21;overflow:hidden}.oi-bar-f{height:100%;border-radius:8px;transition:width .5s}.oi-bar-l{font-size:13px;font-family:var(--mono);min-width:58px;text-align:right}
.lang-btn:hover,.ghost-btn:hover{border-color:var(--amber-dim);color:var(--amber)}
/* ---- 涨跌配色切换按钮 ---- */
body.cn-flip{--up:var(--red);--down:var(--green);--up-soft:var(--red-soft);--down-soft:var(--green-soft)}
.color-btn{display:inline-flex;align-items:center;gap:4px;background:var(--bg2);border:1px solid var(--line2);color:var(--text2);font-size:11px;padding:5px 9px;border-radius:4px;cursor:pointer;font-family:var(--mono);transition:.15s;line-height:1}
.color-btn:hover{border-color:var(--amber-dim);color:var(--amber)}
.color-btn .cb-up{color:var(--up);font-weight:700;font-size:10px}
.color-btn .cb-down{color:var(--down);font-weight:700;font-size:10px}
.color-btn .cb-arr{display:flex;flex-direction:column;line-height:.9}
.user-chip{font-family:var(--mono);font-size:11.5px;color:var(--green);border:1px solid rgba(95,158,122,.35);padding:2px 8px;border-radius:4px;background:var(--green-soft);display:inline-flex;align-items:center;white-space:nowrap}
#vipChip{display:inline-flex;align-items:center}

/* ---- Tab 导航 ---- */
.tabnav{max-width:1280px;margin:0 auto;padding:0 20px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabnav::-webkit-scrollbar{display:none}
.tab{padding:9px 14px;font-size:13px;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:.15s;user-select:none}
.tab:hover{color:var(--text)}
.tab.active{color:var(--amber);border-bottom-color:var(--amber);font-weight:600}
.tab .lock{font-size:10px;color:var(--text3);margin-left:3px}
.tab.member-tab.active .lock{color:var(--amber-dim)}

/* ---- 主体 ---- */
main{max-width:1280px;margin:0 auto;padding:20px}
.panel{display:none;animation:fadein .25s ease}
.panel.active{display:block}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ---- 卡片 ---- */
.card{background:var(--bg1);border:1px solid var(--line);border-radius:8px;padding:18px 20px;margin-bottom:16px}
.card-title{font-family:var(--serif);font-size:16px;color:var(--text);margin-bottom:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card-title::before{content:"";width:3px;height:16px;background:var(--amber);border-radius:2px;flex:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media(max-width:960px){.grid2,.grid3,.grid4{grid-template-columns:1fr}}

/* ---- 徽章 / 状态 ---- */
.badge{display:inline-block;font-family:var(--mono);font-size:11px;padding:2px 9px;border-radius:3px;letter-spacing:.5px;border:1px solid}
.badge.bullish,.badge.risk_on,.badge.aggressive{color:var(--up);border-color:rgba(95,158,122,.4);background:var(--up-soft)}
.badge.approved{color:var(--green);border-color:rgba(95,158,122,.4);background:var(--green-soft)}
.badge.cautiously_bullish{color:#8aa37a;border-color:rgba(138,163,122,.35);background:rgba(138,163,122,.1)}
.badge.neutral,.badge.cautious,.badge.pending{color:var(--amber);border-color:rgba(217,164,65,.35);background:var(--amber-soft)}
.badge.cautiously_bearish{color:#b98a6b;border-color:rgba(185,138,107,.35);background:rgba(185,138,107,.1)}
.badge.bearish,.badge.risk_off,.badge.defensive{color:var(--down);border-color:rgba(192,106,94,.4);background:var(--down-soft)}
.badge.rejected{color:var(--red);border-color:rgba(192,106,94,.4);background:var(--red-soft)}
.badge.diverge{color:var(--yellow);border-color:rgba(201,162,77,.5);background:rgba(201,162,77,.12)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px}
.dot.g{background:var(--green);box-shadow:0 0 6px rgba(95,158,122,.6)}
.dot.y{background:var(--yellow)}
.dot.r{background:var(--red)}
.dot.gray{background:var(--text3)}

/* ---- 每日判断卡 ---- */
.verdict-hero{display:grid;grid-template-columns:340px 1fr;gap:20px}
@media(max-width:960px){.verdict-hero{grid-template-columns:1fr}}
.verdict-main-text{font-family:var(--serif);font-size:17px;line-height:1.8;color:var(--text)}
.verdict-label{font-family:var(--mono);font-size:10px;color:var(--text3);letter-spacing:2px;text-transform:uppercase;margin:14px 0 4px}
.verdict-block{font-size:13px;color:var(--text2);line-height:1.75}
.verdict-block b{color:var(--text);font-weight:600}
.whatsnew{border-left:2px solid var(--amber-dim);padding-left:12px;margin-top:12px;font-size:13px;color:var(--text2)}
.diverge-box{margin-top:12px;padding:10px 14px;border:1px dashed rgba(201,162,77,.45);border-radius:6px;font-size:12.5px;color:var(--yellow);background:rgba(201,162,77,.06)}
.quote-box{font-family:var(--serif);font-style:italic;font-size:14.5px;line-height:1.8;color:var(--text2);border-left:3px solid var(--amber);padding:6px 0 6px 16px;margin:4px 0}
.quote-src{font-style:normal;font-family:var(--mono);font-size:10.5px;color:var(--text3);display:block;margin-top:6px}

/* ---- posture 仪表 ---- */
.gauge-wrap{display:flex;flex-direction:column;align-items:center;gap:6px}
.gauge-score{font-family:var(--mono);font-size:34px;color:var(--amber);line-height:1}
.gauge-state{font-family:var(--serif);font-size:15px}
.days-held{font-family:var(--mono);font-size:11px;color:var(--text3)}
.factor-row{display:grid;grid-template-columns:130px 1fr 46px;align-items:center;gap:10px;margin:7px 0;font-size:12px}
.factor-name{color:var(--text2)}
.factor-bar{position:relative;height:10px;background:var(--bg2);border-radius:5px;overflow:hidden}
.factor-center{position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--line2)}
.factor-fill{position:absolute;top:0;bottom:0;border-radius:5px}
.factor-fill.pos{background:var(--up);opacity:.75}
.factor-fill.neg{background:var(--down);opacity:.75}
.factor-val{font-family:var(--mono);font-size:11px;text-align:right;color:var(--text2)}

/* ---- 表格 ---- */
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{font-family:var(--mono);font-size:10.5px;letter-spacing:1px;color:var(--text3);text-transform:uppercase;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line2);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);color:var(--text2);vertical-align:middle}
tr:hover td{background:rgba(255,255,255,.02)}
.num{font-family:var(--mono);font-size:12.5px}
.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--text3)}
tr.pending-row td{background:rgba(217,164,65,.07)}
tr.pending-row td:first-child{border-left:2px solid var(--amber)}

/* ---- 8币卡 ---- */
.coin-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media(max-width:1100px){.coin-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.coin-grid{grid-template-columns:1fr}}
.coin-card{background:var(--bg1);border:1px solid var(--line);border-radius:8px;padding:15px 16px;position:relative;transition:border-color .2s}
.coin-card:hover{border-color:var(--line2)}
.coin-card.diverged{border-color:rgba(201,162,77,.55)}
.coin-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.coin-sym{font-family:var(--serif);font-size:17px;letter-spacing:.5px}
.coin-price{font-family:var(--mono);font-size:15px;margin:6px 0 2px}
.conf-bar{height:4px;background:var(--bg2);border-radius:2px;margin:9px 0 6px;overflow:hidden}
.conf-fill{height:100%;background:var(--amber);border-radius:2px}
.coin-headline{font-size:12px;color:var(--text2);line-height:1.6;min-height:38px}
.coin-official{margin-top:9px;padding-top:8px;border-top:1px dashed var(--line);font-size:11px;color:var(--text3)}
.coin-official .of-tag{font-family:var(--mono);font-size:9.5px;letter-spacing:1px;text-transform:uppercase}

/* ---- 锁定卡 ---- */
.lock-card{background:var(--bg1);border:1px solid var(--line);border-radius:8px;padding:52px 30px;text-align:center;max-width:560px;margin:30px auto}
.lock-icon{font-size:34px;margin-bottom:14px;opacity:.85}
.lock-title{font-family:var(--serif);font-size:19px;margin-bottom:8px}
.lock-desc{color:var(--text2);font-size:13px;max-width:400px;margin:0 auto 20px}
.btn{background:var(--amber);color:#1a1408;border:none;font-size:13px;font-weight:600;padding:9px 22px;border-radius:5px;cursor:pointer;transition:.15s;font-family:var(--sans)}
.btn:hover{background:#e8b654}
.btn.secondary{background:var(--bg2);color:var(--text2);border:1px solid var(--line2);font-weight:400}
.btn.secondary:hover{border-color:var(--amber-dim);color:var(--amber);background:var(--bg2)}
.btn.danger{background:transparent;color:var(--red);border:1px solid rgba(192,106,94,.4)}
.btn.danger:hover{background:var(--red-soft)}
.btn.small{padding:4px 12px;font-size:12px}

/* ---- 表单 ---- */
.form-box{max-width:400px;margin:24px auto}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--text2);margin-bottom:5px}
.field input{width:100%;background:var(--bg2);border:1px solid var(--line2);border-radius:5px;color:var(--text);font-size:14px;padding:9px 12px;outline:none;transition:.15s;font-family:var(--sans)}
.field input:focus{border-color:var(--amber-dim)}
.form-msg{font-size:12.5px;margin:10px 0;min-height:18px}
.form-msg.err{color:var(--red)}.form-msg.ok{color:var(--green)}
.form-switch{text-align:center;font-size:12.5px;color:var(--text2);margin-top:14px}

/* ---- 词典 ---- */
.glossary-grid{display:flex;flex-wrap:wrap;gap:8px}
.g-term{background:var(--bg2);border:1px solid var(--line2);border-radius:6px;padding:6px 11px;cursor:pointer;transition:.15s;user-select:none;display:inline-flex;align-items:baseline;gap:6px;max-width:100%}
.g-term:hover{border-color:var(--amber-dim);background:var(--bg3)}
.g-term.open{border-color:var(--amber);background:rgba(217,164,65,.08)}
.g-term .gt-zh{font-size:12.5px;color:var(--text);font-weight:500;white-space:nowrap}
.g-term .gt-en{font-size:10.5px;color:var(--text3);font-family:var(--mono)}
.g-term .gt-arrow{font-size:9px;color:var(--amber);transition:transform .2s}
.g-term.open .gt-arrow{transform:rotate(180deg)}
.g-detail{flex-basis:100%;background:var(--bg1);border:1px solid var(--line);border-left:3px solid var(--amber);border-radius:6px;padding:10px 14px;font-size:12px;color:var(--text2);line-height:1.7;animation:fadeIn .2s}
@media(max-width:860px){.g-term{flex:1 1 auto}}

/* ---- 留言板 ---- */
.msg-composer{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:14px}
.msg-composer textarea{width:100%;min-height:70px;background:var(--bg1);border:1px solid var(--line2);border-radius:6px;color:var(--text);font-family:var(--sans);font-size:13px;padding:10px;resize:vertical;outline:none}
.msg-composer textarea:focus{border-color:var(--amber-dim)}
.msg-composer .msg-bar{display:flex;align-items:center;justify-content:space-between;margin-top:8px;gap:8px;flex-wrap:wrap}
.msg-composer .msg-count{font-size:11px;color:var(--text3);font-family:var(--mono)}
.msg-composer .msg-count.warn{color:var(--amber)}
.msg-list{display:flex;flex-direction:column;gap:8px}
.msg-item{display:flex;gap:10px;background:var(--bg1);border:1px solid var(--line);border-radius:8px;padding:10px 12px;align-items:flex-start;animation:fadeIn .25s}
.msg-avatar{width:34px;height:34px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;margin-top:2px;user-select:none}
.msg-body{flex:1;min-width:0}
.msg-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:3px}
.msg-user{font-size:13px;font-weight:600;color:var(--text)}
.msg-time{font-size:10.5px;color:var(--text3);font-family:var(--mono)}
.msg-content{font-size:13px;color:var(--text2);line-height:1.65;word-break:break-word;white-space:pre-wrap}
.msg-del{font-size:10.5px;color:var(--text3);cursor:pointer;padding:1px 6px;border-radius:3px;border:1px solid transparent}
.msg-del:hover{color:var(--red);border-color:var(--line2)}
.msg-empty{text-align:center;padding:50px 20px;color:var(--text3);font-size:12px}
.msg-login-hint{font-size:11.5px;color:var(--text3);background:var(--bg2);border:1px dashed var(--line2);border-radius:6px;padding:10px;text-align:center;margin-bottom:12px}
.msg-login-hint b{color:var(--amber)}
/* ---- 图表 ---- */
.chart-box{background:var(--bg2);border:1px solid var(--line);border-radius:6px;padding:12px}
svg text{font-family:var(--mono)}

<script>
'use strict';
/* ================= W1 Terminal Frontend Core ================= */
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtPct=(v,d=2)=>v==null?'—':(v>0?'+':'')+Number(v).toFixed(d)+'%';
const fmtUsd=v=>{if(v==null)return'—';const n=Number(v);if(n>=1e12)return'$'+(n/1e12).toFixed(2)+'T';if(n>=1e9)return'$'+(n/1e9).toFixed(2)+'B';if(n>=1e6)return'$'+(n/1e6).toFixed(1)+'M';if(n>=1e3)return'$'+(n/1e3).toFixed(1)+'K';return'$'+n.toFixed(2)};
const fmtPrice=v=>v==null?'—':(v>=1000?'$'+Number(v).toLocaleString('en-US',{maximumFractionDigits:1}):v>=1?'$'+Number(v).toFixed(2):'$'+Number(v).toFixed(4));
const fmtTs=ts=>{if(!ts)return'—';const d=new Date(ts*1000);return d.toLocaleString('zh-CN',{hour12:false,timeZone:'Asia/Shanghai'})};
const fmtDur=sec=>{if(!sec||sec<0)return'—';const d=Math.floor(sec/86400),h=Math.floor((sec%86400)/3600),m=Math.floor((sec%3600)/60),s=sec%60;return(d?d+'d ':'')+(h?h+'h ':'')+m+'m '+s+'s'};
const barClass=pct=>pct>=85?'red':pct>=70?'orange':pct>=50?'yellow':'green';
const cls=v=>v>0?'up':v<0?'down':'flat';
const stanceZh=s=>({bullish:'看多',cautiously_bullish:'谨慎看多',neutral:'中性',cautiously_bearish:'谨慎看空',bearish:'看空',aggressive:'积极',defensive:'防御',risk_on:'进攻',risk_off:'避险',cautious:'谨慎'}[s]||s);
const stanceEn=s=>({cautiously_bullish:'cautiously bullish',cautiously_bearish:'cautiously bearish',risk_on:'risk on',risk_off:'risk off'}[s]||s);

const state={lang:'zh',user:null,admin:false,tab:'overview',timers:{},cache:{}};
const T=(zh,en)=>state.lang==='zh'?zh:(en||zh);

async function api(path,opts){
  const r=await fetch(path,Object.assign({headers:{'Content-Type':'application/json'}},opts||{}));
  let data=null;try{data=await r.json()}catch(e){}
  if(r.status===401&&data&&data.need_login)return{__needLogin:true,status:401};
  if(r.status===401&&data&&data.need_admin)return{__needAdmin:true,status:401};

}

function dataTsHtml(ts,stale){return `<span class="data-ts${stale?' stale':''}">数据 ${fmtTs(ts)}</span>${stale?'<span class="stale-tag">STALE</span>':''}`}
function clearTimers(){Object.values(state.timers).forEach(clearInterval);state.timers={}}
const tabRefresh={overview:120000,coins:120000,sentiment:120000,flows:300000,markets:60000,oracle:1800000,liquidation:600000,signals:30000,access:60000};

<script>
'use strict';
/* ================= SVG 图表助手 ================= */
function gaugeSVG(score,min,max,opts){ // posture -5..+5 / fgi 0..100
  const o=Object.assign({size:200,label:'',color:'#d9a441'},opts||{});
  const frac=Math.max(0,Math.min(1,(score-min)/(max-min)));
  const cx=100,cy=95,r=78;
  const arc=(a0,a1,rad)=>{const p=a=>[cx+rad*Math.cos(Math.PI*(1-a)),cy-rad*Math.sin(Math.PI*(1-a))];const[x0,y0]=p(a0),[x1,y1]=p(a1);return`M ${x0} ${y0} A ${rad} ${rad} 0 0 1 ${x1} ${y1}`};
  const na=frac; // 0..1 映射半圆
  const nx=cx+r*Math.cos(Math.PI*(1-na)),ny=cy-r*Math.sin(Math.PI*(1-na));
  let ticks='';
  for(let i=0;i<=10;i++){const a=i/10,tx1=cx+(r-8)*Math.cos(Math.PI*(1-a)),ty1=cy-(r-8)*Math.sin(Math.PI*(1-a)),tx2=cx+(r-2)*Math.cos(Math.PI*(1-a)),ty2=cy-(r-2)*Math.sin(Math.PI*(1-a));ticks+=`<line x1="${tx1}" y1="${ty1}" x2="${tx2}" y2="${ty2}" stroke="#3c424d" stroke-width="1.5"/>`}
  const zoneColor=frac<0.33?'#c06a5e':frac<0.66?'#d9a441':'#5f9e7a';
  return `<svg viewBox="0 0 200 115" width="${o.size}" height="${o.size*0.575}">
    <path d="${arc(0,1,r)}" fill="none" stroke="#2a2f38" stroke-width="11" stroke-linecap="round"/>
    <path d="${arc(0,na,r)}" fill="none" stroke="${zoneColor}" stroke-width="11" stroke-linecap="round"/>
    ${ticks}
    <line x1="${cx}" y1="${cy}" x2="${nx*0.92+cx*0.08}" y2="${ny*0.92+cy*0.08}" stroke="#d8d5cd" stroke-width="2" transform="rotate(0 ${cx} ${cy})"/>
    <circle cx="${cx}" cy="${cy}" r="4" fill="#d8d5cd"/>
    <text x="18" y="112" fill="#6d6a62" font-size="9">${min}</text>
    <text x="176" y="112" fill="#6d6a62" font-size="9">${max}</text>
    <text x="100" y="112" fill="#6d6a62" font-size="8.5" text-anchor="middle">${esc(o.label)}</text>
  </svg>`;
}
function candleChartSVG(candles,opts){ // candles:[{t,o,h,l,c}]，opts.yLabel 自定义 y 轴标签
  const o=Object.assign({w:640,h:260,up:'#3aa06e',dn:'#e05a4e',yLabel:v=>fmtPrice(v)},opts||{});
  if(!candles||!candles.length)return'<div class="empty">no data</div>';
  const pad={l:46,r:10,t:14,b:24},W=o.w,H=o.h,iw=W-pad.l-pad.r,ih=H-pad.t-pad.b;
  const n=candles.length;
  const lo=Math.min(...candles.map(c=>c.l)),hi=Math.max(...candles.map(c=>c.h));
  const span=(hi-lo)||1;
  const x=i=>pad.l+iw*(i+0.5)/n;
  const y=v=>pad.t+ih*(1-(v-lo)/span);
  const cw=Math.max(2,iw/n*0.62);
  const ma=p=>{const out=[];for(let i=p-1;i<n;i++){let s=0;for(let j=0;j<p;j++)s+=candles[i-j].c;out.push({x:x(i),y:y(s/p)});}return out;};
  let g='';
  for(let i=0;i<=4;i++){const v=lo+span*i/4,yy=y(v);g+=`<line x1="${pad.l}" y1="${yy}" x2="${W-pad.r}" y2="${yy}" stroke="#31363f" stroke-width="0.5"/><text x="${pad.l-4}" y="${yy+3}" fill="#6d6a62" font-size="8" text-anchor="end">${esc(String(o.yLabel(v)))}</text>`}
  let body='';
  candles.forEach((c,i)=>{
    const up=c.c>=c.o;
    const col=up?o.up:o.dn;
    body+=`<line x1="${x(i)}" y1="${y(c.h)}" x2="${x(i)}" y2="${y(c.l)}" stroke="${col}" stroke-width="1"/>`;
    const yo=y(c.o),yc=y(c.c),bh=Math.max(1,Math.abs(yc-yo));
    body+=`<rect x="${x(i)-cw/2}" y="${Math.min(yo,yc)}" width="${cw}" height="${bh}" fill="${col}" rx="0.5"/>`;
  });
  const ma7=ma(7),ma25=ma(25);
  const line=(pts,col)=>{if(pts.length<2)return'';return'<path d="'+pts.map((p,j)=>(j?'L':'M')+p.x.toFixed(1)+' '+p.y.toFixed(1)).join(' ')+'" fill="none" stroke="'+col+'" stroke-width="1.2" opacity="0.85"/>';};
  // x 轴日期标签（首/中/末）
  const dLabel=c=>String(c.t||'').slice(5).replace('-','/');
  const xl=[candles[0],candles[Math.floor(n/2)],candles[n-1]].map((c,i)=>{
    const ix=i===0?0:i===1?Math.floor(n/2):n-1;
    return `<text x="${x(ix)}" y="${H-7}" fill="#6d6a62" font-size="8" text-anchor="middle">${esc(dLabel(c))}</text>`;
  }).join('');
  const tl=ma(7).length>=2?`<text x="${W-pad.r}" y="${pad.t-3}" fill="#5b8ff9" font-size="8" text-anchor="end">MA7</text>`:'';
  const tl2=ma(25).length>=2?`<text x="${W-pad.r-34}" y="${pad.t-3}" fill="#d9a441" font-size="8" text-anchor="end">MA25</text>`:'';
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="xMidYMid meet" style="max-height:${H+20}px">${g}${body}${line(ma7,'#5b8ff9')}${line(ma25,'#d9a441')}${xl}${tl}${tl2}</svg>`;
}
// 姿态评分 → K线（按 N 天合并，hist 需 oldest first）
function candlesFromHist(hist,n){
  const out=[];
  for(let i=0;i<hist.length;i+=n){
    const seg=hist.slice(i,i+n);
    if(!seg.length)continue;
    out.push({t:seg[0].date, o:seg[0].score, h:Math.max(...seg.map(x=>x.score)), l:Math.min(...seg.map(x=>x.score)), c:seg[seg.length-1].score});
  }
  return out;
}
function lineChartSVG(points,opts){ // points:[{x:label,y:value}] 或 [number]
  const o=Object.assign({w:640,h:200,color:'#d9a441',fill:true,yLabel:v=>v},opts||{});
  const vals=points.map(p=>typeof p==='number'?p:p.y);
  if(!vals.length)return'<div class="empty">no data</div>';
  const min=Math.min(...vals),max=Math.max(...vals),span=(max-min)||1;
  const pad={l:34,r:8,t:10,b:18};
  const W=o.w,H=o.h,iw=W-pad.l-pad.r,ih=H-pad.t-pad.b;
  const xy=(i,v)=>[pad.l+iw*(vals.length===1?0.5:i/(vals.length-1)),pad.t+ih*(1-(v-min)/span)];
  const path=vals.map((v,i)=>{const[x,y]=xy(i,v);return(i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1)}).join(' ');
  const area=path+` L ${xy(vals.length-1,min)[0]} ${pad.t+ih} L ${xy(0,min)[0]} ${pad.t+ih} Z`;
  let grid='';
  for(let i=0;i<=3;i++){const v=min+span*i/3,y=pad.t+ih*(1-i/3);grid+=`<line x1="${pad.l}" y1="${y}" x2="${W-pad.r}" y2="${y}" stroke="#31363f" stroke-width="0.5"/><text x="${pad.l-4}" y="${y+3}" fill="#6d6a62" font-size="8" text-anchor="end">${esc(o.yLabel(v))}</text>`}
  const dot=xy(vals.length-1,vals[vals.length-1]);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="xMidYMid meet" style="max-height:${H+20}px">
    ${grid}
    ${o.fill?`<path d="${area}" fill="${o.color}" opacity="0.10"/>`:''}
    <path d="${path}" fill="none" stroke="${o.color}" stroke-width="1.6"/>
    <circle cx="${dot[0]}" cy="${dot[1]}" r="3" fill="${o.color}"/>
    <text x="${dot[0]-4}" y="${dot[1]-7}" fill="${o.color}" font-size="9" text-anchor="end">${esc(String(Math.round(vals[vals.length-1]*100)/100))}</text>
  </svg>`;
}
function barChartSVG(items,opts){ // items:[{label,value,color?}]
  const o=Object.assign({w:640,h:220,color:'#d9a441'},opts||{});
  if(!items.length)return'<div class="empty">no data</div>';
  const pad={l:8,r:8,t:14,b:26},W=o.w,H=o.h,iw=W-pad.l-pad.r,ih=H-pad.t-pad.b;
  const maxAbs=Math.max(...items.map(i=>Math.abs(i.value)),1);
  const zeroY=pad.t+ih*(items.some(i=>i.value<0)?maxAbs/(2*maxAbs):1);
  const scale=v=>ih*(Math.abs(v)/(2*maxAbs));
  const bw=Math.min(28,iw/items.length*0.62);
  let bars='',labels='';
  items.forEach((it,i)=>{
    const x=pad.l+iw*(i+0.5)/items.length-bw/2;
    const h=scale(it.value);
    const y=it.value>=0?zeroY-h:zeroY;
    const c=it.color||(it.value>=0?'var(--up)':'var(--down)');
    bars+=`<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(h,1)}" fill="${c}" opacity="0.8" rx="2"/>
      <text x="${x+bw/2}" y="${it.value>=0?y-4:y+h+11}" fill="${c}" font-size="8.5" text-anchor="middle">${esc(String(it.value))}</text>`;
    labels+=`<text x="${x+bw/2}" y="${H-8}" fill="#6d6a62" font-size="8" text-anchor="middle">${esc(it.label)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="xMidYMid meet" style="max-height:${H+20}px">
    <line x1="${pad.l}" y1="${zeroY}" x2="${W-pad.r}" y2="${zeroY}" stroke="#3c424d" stroke-width="1"/>
    ${bars}${labels}
  </svg>`;
}

async function loadNews(src){
  const el=$("#newsList");
  if(!el)return;
  const r=await api("/api/news");
  if(!r.ok||!r.items){el.innerHTML=`<div class="news-empty">${T("加载失败","Load failed")}</div>`;return}
  let items=r.items;
  if(src!=="all")items=items.filter(i=>i.source===src);
  if(!items.length){el.innerHTML=`<div class="news-empty">${T("暂无消息","No news")}</div>`;return}
  const now=Date.now();
  el.innerHTML=items.map((n,i)=>{
    const dt=n.ts?fmtDate(n.ts*1000):n.time||"";
    const sentCls=n.sentiment||"neutral";
    const sentLabel={bullish:T('利多','Bullish'),bearish:T('利空','Bearish'),neutral:T('中性','Neutral')}[sentCls];

      +'<div class="news-body">'

      +'<a class="news-title" href="'+esc(url)+'" target="_blank" rel="noopener">'+esc(n.title||n.content.slice(0,60))+'</a></div>'
      +'<div class="news-content">'+esc(n.content?n.content.slice(0,200):"")+'</div>'
      +'<div class="news-meta">'
      +'<span class="news-src">'+esc(n.sourceLabel||n.source)+'</span>'
      +'<span class="news-time">'+dt+'</span>'
      +'</div></div></div>';
  }).join("");
}

function fmtDate(ts){
  const d=new Date(ts);
  const now=new Date();
  const diff=now-d;
  if(diff<60000)return `${T('刚刚','just now')}`;
  if(diff<3600000)return Math.floor(diff/60000)+`${T('分钟前','m ago')}`;
  if(diff<86400000)return Math.floor(diff/3600000)+`${T('小时前','h ago')}`;
  const mm=(d.getMonth()+1).toString().padStart(2,"0");
  const dd=d.getDate().toString().padStart(2,"0");
  const hh=d.getHours().toString().padStart(2,"0");
  const mi=d.getMinutes().toString().padStart(2,"0");
  if(d.getFullYear()===now.getFullYear())return mm+"/"+dd+" "+hh+":"+mi;
  return d.getFullYear()+"/"+mm+"/"+dd+" "+hh+":"+mi;
}

    var days=p&&p.days_held!=null?p.days_held:0;
    
    // Compute gauge needle angle: -5→-90deg, +5→+90deg

PANELS.liquidation=async function(){startTabTimer('liquidation',PANELS.liquidation);

    const ex=d.exchanges||{};

    if(ex.ALL&&ex.ALL.rows&&ex.ALL.rows.length)names.unshift('ALL');
    const dataMap={}; let grand=0;
    names.forEach(function(n){
      const rows=ex[n].rows||[];
      const total=rows.reduce((s,x)=>s+x.liq_24h,0);
      const longV=rows.reduce((s,x)=>s+x.long_24h,0);
      const shortV=rows.reduce((s,x)=>s+x.short_24h,0);
      dataMap[n]={rows:rows,total:total,longV:longV,shortV:shortV,covered:(n==='ALL'?ex.ALL.covered:1)};
      grand+=total;
    });
    if(!names.length){main.innerHTML='<div class="card"><div class="card-title">💥 清算数据</div>'
      +'<div class="empty">数据源暂不可用（Coinglass API 未恢复），采集会自动重试</div>'
      +'<div class="data-ts" style="margin-top:6px">'+T('来源: ','Source: ')+'Coinglass Liquidation Coin List</div></div>';return}
    const tsHtml=(d.data_ts?'<span class="data-ts">数据 '+fmtTs(d.data_ts)+'</span>':'');

      const m=dataMap[name];
      const longPct=m.total>0?(m.longV/m.total*100):0;
      const shortPct=m.total>0?(m.shortV/m.total*100):0;
      const title=name==='ALL'?T('🌐 全平台','🌐 All'):esc(name);
      const sub=name==='ALL'?('覆盖 '+m.covered+' 所 · 24h 清算总额'):T('24h 清算总额','24h Liq Total');
      return '<div class="card" style="flex:1;min-width:220px"><div class="card-title" style="margin-bottom:8px">'

        +'<div style="font-size:22px;font-family:var(--mono);color:var(--down)">'+fmtUsd(m.total)+'</div>'
        +'<div style="font-size:11px;color:var(--text3);margin:2px 0 8px">'+sub+'</div>'
        +'<div style="display:flex;gap:16px;font-size:12px;margin-bottom:6px;flex-wrap:wrap">'

        +'<span style="color:var(--up)">空头爆仓 '+fmtUsd(m.shortV)+' <span class="data-ts">'+shortPct.toFixed(1)+'%</span></span>'
        +'</div>'
        +'<div class="bar-track" style="max-width:none;display:flex"><div class="bar-fill" style="background:var(--down);width:'+longPct+'%"></div><div class="bar-fill" style="background:var(--up);width:'+shortPct+'%"></div></div>'
        +'<div class="data-ts" style="margin-top:6px">'+m.rows.length+' 个币种有清算</div></div>';

      +'清算数据来自 Coinglass 各交易所合约爆仓统计（8 所聚合）。「🌐 全平台」按币种跨所汇总，覆盖所数=该币种在几所有爆仓。'
      +'多头爆仓（红）表示多头仓位被强平，通常伴随价格下行压力；空头爆仓（绿）表示空头被强平。'
      +'多/空比 = 多头爆仓额 ÷ 空头爆仓额，比值越高说明多头踩踏越剧烈。'
      +'数据仅供研究，不构成投资建议。'
      +'</div></div>';

      }).join('');
      const dayBars=(st.daily||[]).map(function(x){
        const c=x.acc>=0.55?'var(--up)':x.acc<=0.45?'var(--down)':'var(--amber)';

          +'<span class="data-ts" style="width:26px;text-align:right">'+x.n+'条</span></div>';

      const fRows=(st.factor_report||[]).slice(0,8).map(function(f){

        +'<div style="overflow-x:auto"><table><thead><tr><th>窗口</th><th>样本</th><th>准确率</th><th>看涨命中</th><th>看跌命中</th></tr></thead><tbody>'+winRows+'</tbody></table></div>'
        +(dayBars?'<div style="margin-top:10px"><div class="data-ts" style="margin-bottom:6px">每日准确率（近 '+st.daily.length+' 天 · 已回填样本）</div>'+dayBars+'</div>':'')
        +(fRows?'<div style="margin-top:10px"><div class="data-ts" style="margin-bottom:6px">因子方向精度（30 天 · edge 相对随机基准）</div><div style="overflow-x:auto"><table><thead><tr><th>因子</th><th>精度</th><th>样本</th><th>edge</th></tr></thead><tbody>'+fRows+'</tbody></table></div></div>':'')
        +'<div class="data-ts" style="margin-top:8px">统计生成 '+st.generated_at+' · 回填窗口 24h · 预测保留 90 天</div></div>';
    }

    if(!d||!d.ok){main.innerHTML='<div class="card"><div class="card-title">📡 BTC 预言机</div><div class="empty">引擎暂不可用（独立服务维护中），稍后自动重试</div><div class="data-ts" style="margin-top:6px">不影响其他功能 · 引擎与主看板隔离</div></div>';return}
    const pu=Math.round(d.p_up*100), pd=Math.round(d.p_down*100), conf=Math.round(d.confidence*100);
    const dirCfg={bullish:{t:'看涨',c:'var(--up)',i:'📈'},bearish:{t:'看跌',c:'var(--down)',i:'📉'},neutral:{t:'中性',c:'var(--amber)',i:'⚖️'}};
    const dc=dirCfg[d.direction]||dirCfg.neutral;
    const tsHtml='<span class="data-ts">'+esc(d.generated_at||'')+' · 模型 '+esc((d.model||{}).version||'v1')+(d.model&&d.model.acc_7d!=null?' · 近7日准确率 '+Math.round(d.model.acc_7d*100)+'%':'')+'</span>';
    const factorRows=(d.factors||[]).map(function(f){

    const histRows=hist.map(function(h,i){

        res=right?'<span style="color:var(--green)">✓ 对</span>':'<span style="color:var(--red)">✗ 错</span>';

        +'<td class="num">'+Math.round(h.confidence*100)+'%</td><td>'+res+'</td></tr>';
    }).join('');
    main.innerHTML='<div class="card" style="margin-bottom:12px"><div class="card-title">📡 BTC 预言机 · 未来 24h 方向预测</div>'
      +'<div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap">'
      +'<div style="text-align:center;min-width:130px"><div style="font-size:46px;font-family:var(--mono);color:'+dc.c+'">'+pu+'<span style="font-size:20px">%</span></div>'
      +'<div style="font-size:12px;color:var(--text2)">上涨概率</div></div>'
      +'<div style="flex:1;min-width:220px">'
      +'<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px"><span style="color:var(--up)">📈 上涨 '+pu+'%</span><span style="color:var(--down)">📉 下跌 '+pd+'%</span></div>'
      +'<div style="display:flex;height:14px;border-radius:7px;overflow:hidden;margin-bottom:8px"><div style="width:'+pu+'%;background:var(--up)"></div><div style="width:'+pd+'%;background:var(--down)"></div></div>'
      +'<div style="display:flex;gap:12px;flex-wrap:wrap;font-size:12px">'
      +'<span>方向 <b style="color:'+dc.c+'">'+dc.i+' '+dc.t+'</b></span>'
      +'<span>置信度 <b style="font-family:var(--mono)">'+conf+'%</b></span>'
      +'<span>跨所共识 <b style="font-family:var(--mono)">'+Math.round((d.consensus||0)*100)+'%</b></span>'
      +'</div></div></div>'
      +'<div style="margin-top:10px">'+tsHtml+'</div></div>'
      +'<div class="card"><div class="card-title">🧩 因子分解 · 谁在推动这个判断</div>'
      +(factorRows||'<div class="empty">暂无因子数据</div>')+'</div>'

function lsrTable(rows,mode){
  if(!rows||!rows.length)return'<div class="empty">暂无数据，等待采集</div>';
  const body=rows.map(c=>{
    const ratio=mode==='whale'?(c.whale_ratio??c.ratio):(c.trader_ratio??c.ratio);
    const d2m=mode==='whale'?(c.whale_delta_2m??c.delta_2m):c.delta_2m;
    const d4h=mode==='whale'?(c.whale_delta_4h??c.delta_4h):(c.trader_delta_4h??c.delta_4h);
    return `<tr><td class="num">${c.rank??''}</td><td>${esc(c.symbol)}</td>
      <td class="num ${cls((ratio||1)-1)}">${ratio!=null?Number(ratio).toFixed(2):'—'}</td>
      <td class="num ${cls(d2m)}">${d2m!=null?fmtPct(d2m*100):'—'}</td>
      <td class="num ${cls(d4h)}">${d4h!=null?fmtPct(d4h*100):'—'}</td>
      <td class="num">${c.oi_mcap_ratio!=null?(c.oi_mcap_ratio*100).toFixed(1)+'%':'—'}</td></tr>`;
  }).join('');
  return `<div style="overflow-x:auto"><table><thead><tr><th>#</th><th>${T('币种','Symbol')}</th><th>${T('多空比','L/S Ratio')}</th><th>Δ2m</th><th>Δ4h</th><th>OI/MCap</th></tr></thead><tbody>${body}</tbody></table></div>`;
}

        +'</div>'

    }catch(e){
      $('#btResult').innerHTML='<div class="empty">'+T('回测异常：','Backtest error: ')+esc(e.message)+'</div>';

  };
  $('#btRun').onclick=runBt;
  document.querySelectorAll('input[name="btModeR"]').forEach(r=>r.onchange=()=>{
    $('#btSymbol').style.display=(document.querySelector('input[name="btModeR"]:checked').value==='single')?'':'none';
    $('#btSymbolsAll').style.display=(document.querySelector('input[name="btModeR"]:checked').value==='single')?'none':'';
  });
  document.querySelector('input[name="btModeR"]:checked').dispatchEvent(new Event('change'));
  const collect=()=>{
    const get=(id,def)=>{const el=document.getElementById(id);return el?el.value:def};
    const num=(id,def)=>{const v=parseFloat(get(id,def));return isFinite(v)?v:def};
    return {
      enabled: document.getElementById('sig_enabled')?document.getElementById('sig_enabled').checked:s.enabled,
      st: { enabled: document.getElementById('sig_st_on')?document.getElementById('sig_st_on').checked:(s.st?s.st.enabled!==false:true) },
      fr: { enabled: document.getElementById('sig_fr_on')?document.getElementById('sig_fr_on').checked:(s.fr?s.fr.enabled!==false:true) },
      common: { cooldown_h: num('sig_cm_cd',4), daily_limit: Math.round(num('sig_cm_dl',8)) }
    };
  };
  $('#sigSave').onclick=async()=>{
    const r=await api('/api/signal/settings',{method:'POST',body:JSON.stringify(collect())});
    if(r.ok){$('#sigMsg').className='form-msg ok';$('#sigMsg').textContent=T('✅ 已保存，下轮扫描生效','Saved, applied next scan')}else{$('#sigMsg').className='form-msg err';$('#sigMsg').textContent=esc(r.error||'保存失败')}
  };
  $('#sigReset').onclick=async()=>{
    const r=await api('/api/signal/settings',{method:'POST',body:JSON.stringify({enabled:true,st:{enabled:true},fr:{enabled:true},common:{cooldown_h:4,daily_limit:8}})});
    if(r.ok){toast('已恢复默认');PANELS.signals()}else toast(r.error||'失败');
  };
  // ---- 市场体制 + 策略档案 ----
  const REG_ZH = { TREND: '📈 趋势', RANGE: '📊 震荡', STORM: '🌪 风暴', OFF: '⏸ 过渡' };
  const STAT_ZH = { paper: '📝 影子期', live: '🟢 实盘', paused: '⏸ 暂停' };
  const loadRegime = async () => {
    const box = $('#regimeBox');
    if (!box) return;
    try {
      const [r, s] = await Promise.all([api('/api/signal/regime'), api('/api/signal/strategies').catch(() => null)]);
      const reg = (r && r.ok && r.regime && r.regime.regime) ? r.regime : null;
      if (!reg) { box.innerHTML = '<div class="empty">' + T('体制未就绪（引擎启动后 15 分钟）','Regime pending') + '</div>'; return; }
      $('#regTs').textContent = T('更新于','Updated') + ' ' + new Date(reg.ts).toLocaleTimeString('zh-CN', { hour12: false });
      let html = '<div class="kv-strip" style="flex-wrap:wrap;gap:10px;margin-bottom:8px">'
        + '<span>' + T('当前体制','Regime') + ' <b style="font-size:14px">' + (REG_ZH[reg.regime] || reg.regime) + '</b></span>'
        + '<span>ADX <b>' + reg.adx + '</b></span>'
        + '<span>ADX斜率 <b>' + reg.adx_slope + '</b></span>'
        + '<span>布林带宽分位 <b>' + (reg.bbw_pct != null ? reg.bbw_pct + '%' : '—') + '</b></span>'
        + '<span>费率z <b>' + reg.funding_z + '</b></span>'
        + '<span>波动分位 <b>' + (reg.vol_pct != null ? reg.vol_pct + '%' : '—') + '</b></span>'
        + '</div>'
        + '<div class="data-ts" style="margin-bottom:8px">' + T('规则','Rules') + ': TREND→趋势策略 · RANGE→费率反转 · STORM→禁言 · OFF→不给新单</div>';
      let shtml = '<div class="empty">' + T('暂无策略','No strategies') + '</div>';
      if (s && s.ok && s.strategies.length) {
        shtml = '<div style="overflow-x:auto"><table><thead><tr><th>'+T('策略','Strat')+'</th><th>'+T('体制','Regime')+'</th><th>'+T('周期','TF')+'</th><th>'+T('状态','Status')+'</th><th>'+T('笔数','Trades')+'</th><th>'+T('胜率','WR%')+'</th><th>'+T('累计盈亏%','PnL%')+'</th><th>'+T('出场分布','Exits')+'</th></tr></thead><tbody>';
        for (const st of s.strategies) {
          const ex = Object.entries(st.exits || {}).map(([k, v]) => k + '×' + v).join(' ') || '—';
          shtml += '<tr><td><b>' + esc(st.name) + '</b> <span class="data-ts">' + st.id + '</span></td>'
            + '<td>' + (REG_ZH[st.regime] || st.regime) + '</td><td class="num">' + st.tf + '</td>'
            + '<td>' + (STAT_ZH[st.status] || st.status) + '</td>'
            + '<td class="num">' + st.trades + '</td>'
            + '<td class="num ' + (st.win_rate >= 50 ? 'up' : 'down') + '">' + st.win_rate + '%</td>'
            + '<td class="num ' + (st.pnl_sum >= 0 ? 'up' : 'down') + '">' + st.pnl_sum + '%</td>'
            + '<td style="font-size:11px">' + esc(ex) + '</td></tr>';
        }
        shtml += '</tbody></table></div>';
      }
      box.innerHTML = html + shtml;
    } catch (e) { box.innerHTML = '<div class="empty">❌ ' + esc(e.message) + '</div>'; }
  };
  loadRegime();
  if (!state.timers['regime']) { state.timers['regime'] = setInterval(() => { if (state.tab === 'signals') loadRegime(); }, 60000); }
  loadHist();
};

/* ================= PANEL: 留言板 ================= */
PANELS.messages=async function(){
  const main=$('#main');
  const loggedIn=!!state.user;
  // 头像色板：按用户名 hash 稳定选色
  const AVATAR_COLORS=['#d9a441','#5f9e7a','#7c4dff','#c06a5e','#4d9dd9','#d96a5e','#5ec4a4','#b8862f','#8a7cff','#e07b54','#4db8b8','#c94da0'];
  const nameHash=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))>>>0;return h};
  const avatarHtml=name=>{
    const color=AVATAR_COLORS[nameHash(name)%AVATAR_COLORS.length];
    const ch=String(name||'?').slice(0,1).toUpperCase();
    return `<div class="msg-avatar" style="background:${color}">${esc(ch)}</div>`;
  };
  const loadList=async()=>{
    const d=await api('/api/messages?limit=100');
    const list=$('#msgList');
    if(!d||!d.ok){list.innerHTML='<div class="msg-empty">加载失败</div>';return}
    const msgs=(d.messages||[]);
    if(!msgs.length){list.innerHTML='<div class="msg-empty">'+T("还没有留言，来抢沙发~","No messages yet, be the first!")+'</div>';return}
    list.innerHTML=msgs.map(m=>{
      const vipHtml=vipBadge(m.vip);
      const canDel=state.admin||(state.user&&state.user.id===m.user_id);
      const displayName=m.nickname||m.username;
      return `<div class="msg-item">${avatarHtml(displayName)}
        <div class="msg-body">
          <div class="msg-head"><span class="msg-user">${esc(displayName)}</span>${m.nickname?'<span class="msg-time">@'+esc(m.username)+'</span>':''}${vipHtml}<span class="msg-time">${fmtTs(Math.floor(m.created_at/1000))}</span>${canDel?'<span class="msg-del" data-id="'+m.id+'">删除</span>':''}</div>
          <div class="msg-content">${esc(m.content)}</div>
        </div></div>`;
    }).join('');
    $$('#msgList .msg-del').forEach(b=>b.onclick=async()=>{
      if(!confirm(T('删除这条留言？','Delete this message?')))return;
      const r=await api('/api/messages/'+b.dataset.id,{method:'DELETE'});
      if(r.ok){toast(T('已删除','Deleted'));loadList()}else toast(r.error||'failed');
    });
  };
  // 渲染
  const composer=loggedIn
    ? `<div class="msg-composer">
        <textarea id="msgInput" maxlength="500" placeholder="${T('写下你的观点…','Share your thoughts…')}"></textarea>
        <div class="msg-bar">
          <span class="msg-count" id="msgCount">0/500 · ${T('每日限 5 条','5/day')}</span>
          <button class="btn small" id="msgSend">${T('发布','Post')}</button>
        </div></div>`
    : `<div class="msg-login-hint">🔒 ${T('登录后才能留言','Login required to post')} — <b>${T('去登录','Login')}</b> → <a href="#" id="msgGoLogin">${T('登录/注册','Login / Register')}</a></div>`;
  main.innerHTML=`<div class="card"><div class="card-title">💬 ${T('留言板 · 大家怎么说','Messages Board')} <span class="data-ts">${T('每日每人 5 条','5 per user per day')}</span></div>${composer}<div class="msg-list" id="msgList"><div class="msg-empty">${T('加载中…','Loading…')}</div></div></div>`;
  if(loggedIn){
    $('#msgInput').oninput=()=>{const n=$('#msgInput').value.length;$('#msgCount').textContent=n+'/500 · '+T('每日限 5 条','5/day');};
    $('#msgSend').onclick=async()=>{
      const content=$('#msgInput').value.trim();
      if(!content){toast(T('写点什么吧','Type something'));return}
      const r=await api('/api/messages',{method:'POST',body:JSON.stringify({content})});
      if(r.ok){$('#msgInput').value='';$('#msgCount').textContent='0/500';toast(T('已发布','Posted'));loadList()}
      else if(r.__needLogin){toast(T('请先登录','Login first'));switchTab('account')}
      else toast(r.message||r.error||T('发布失败','Failed'));
    };
  }else{
    const gl=$('#msgGoLogin');
    if(gl)gl.onclick=e=>{e.preventDefault();switchTab('account')};
  }
  loadList();
};

PANELS.countdown=async function(){
  const main=$('#main');
  main.innerHTML='<div class="card">'+T('加载中…','Loading…')+'</div>';
  const d=await api('/api/member/countdown');
  if(d.__needLogin){state.user=null;switchTab('countdown');return}
  const cd=d.countdown,p=d.posture;
  const moveZh={done:'已达成',closer:'接近中',none:'无进展'};
  const conds=(cd.conditions||[]).map(c=>{
    const pct=Math.round((c.progress||0)*100);
    const col=c.today_move==='done'?'#5f9e7a':c.today_move==='closer'?'#d9a441':'#6d6a62';
    return `<div class="cond-card">
      <div class="cond-head"><span class="cond-label">${esc(state.lang==='zh'?c.label_zh:c.label_en)}</span>
        <span class="cond-bucket" style="color:${col}">${esc(c.distance_bucket||'')} · ${esc(moveZh[c.today_move]||c.today_move)}</span></div>
      <div class="cond-line">${esc(state.lang==='zh'?c.line_zh:c.line_en)}</div>
      <div class="progress"><div class="progress-fill" style="width:${pct}%;${c.today_move==='done'?'background:#5f9e7a':''}"></div></div>
      <div class="data-ts">${pct}%</div>
    </div>`;
  }).join('');
  const off=(cd.official||[]).map(c=>`<tr><td>${esc(c.label_zh||c.key)}</td><td>${esc(c.line_zh||'')}</td><td class="num">${esc(c.distance_bucket||'')}</td><td class="num">${esc(c.today_move||'')}</td></tr>`).join('');
  main.innerHTML=`<div class="card">
    <div class="card-title">${T('翻转条件倒计时','Flip Condition Countdown')}
      <span style="margin-left:auto">${dataTsHtml(d.data_ts,d.stale)}</span></div>
    <div class="kv-strip">
      <span>${T('当前姿态','posture')} <b>${esc(p.state)} ${p.score>0?'+':''}${p.score}</b></span>
      <span>${T('已维持','held')} <b>${p.days_held}d</b></span>
      <span>${T('目标状态','target')} <b>${esc(cd.target_state)}</b></span>
      <span>${T('总体进度','overall')} <b>${Math.round((cd.overall_progress||0)*100)}%</b></span>
    </div>
    <div class="verdict-block" style="margin-bottom:14px">${esc(cd.note_zh||'')}</div>
    ${conds}
  </div>
  ${off?`<div class="card"><div class="card-title">${T('William countdown 对照','William Countdown')}</div>
    <div style="overflow-x:auto"><table><thead><tr><th>${T('条件','Cond')}</th><th>${T('描述','Line')}</th><th>${T('距离','Distance')}</th><th>${T('今日动向','Move')}</th></tr></thead><tbody>${off}</tbody></table></div></div>`:''}`;
};

function vipBadge(v){
  if(!v)return '';
  const cfg={
    owner:{icon:'👑',cls:'vip-owner',text:'老板',sub:'无限'},
    eternal:{icon:'💎',cls:'vip-eternal',text:'至尊',sub:'永久'},
    gold:{icon:'★',cls:'vip-gold',text:'黄金',sub:v.desc||''},
    platinum:{icon:'◆',cls:'vip-platinum',text:'白金',sub:v.desc||''},
    normal:{icon:'●',cls:'vip-normal',text:'普通',sub:v.desc||''},
    expired:{icon:'○',cls:'vip-expired',text:'到期',sub:'额度已归零'}
  };
  const c=cfg[v.level]||cfg.normal;
  const body=(v.level==='owner'||v.level==='eternal')?c.text:(c.text+' '+c.sub.replace(' 天','天'));
  return '<span class="vip-badge '+c.cls+'" title="'+c.text+' · '+c.sub+'">'+c.icon+' '+body+'</span>';
}
function vipHero(v){
  if(!v)return '';
  const cfg={
    owner:{icon:'👑',cls:'vip-owner',text:'老板',sub:'无限',tip:'尊贵的老板，欢迎回来'},
    eternal:{icon:'💎',cls:'vip-eternal',text:'至尊会员',sub:'永久',tip:'永久尊享全部会员权益'},
    gold:{icon:'🌟',cls:'vip-gold',text:'黄金会员',sub:v.desc||'',tip:'黄金尊享 · 90 天以上权益'},
    platinum:{icon:'💠',cls:'vip-platinum',text:'白金会员',sub:v.desc||'',tip:'白金尊享 · 30 天以上权益'},
    normal:{icon:'✨',cls:'vip-normal',text:'普通会员',sub:v.desc||'',tip:'会员权益生效中'},
    expired:{icon:'⏳',cls:'vip-expired',text:'会员已到期',sub:'额度已归零',tip:'请联系管理员续费'}
  };
  const c=cfg[v.level]||cfg.normal;
  return '<div class="card vip-hero" style="background:linear-gradient(135deg,var(--bg1),var(--bg2));border:1px solid var(--line)">'
    +'<span style="font-size:26px">'+c.icon+'</span>'
    +'<div><div class="vip-title">'+c.text+'</div>'

    +'<span class="vip-badge '+c.cls+'" style="margin-left:auto">'+c.text+'</span></div>';
}
function refreshUserChip(){
  const chip=$('#userChip');
  const vchip=$('#vipChip');
  if(state.admin){
    chip.style.display='';chip.className='user-chip vip-chip-owner';chip.innerHTML='👑 老板·无限';
    vchip.style.display='none';
    return;
  }
  if(state.user){
    chip.style.display='';chip.className='user-chip';
    chip.innerHTML='◆ '+esc(state.user.nickname||state.user.username);
    vchip.style.display='';vchip.innerHTML=vipBadge(state.user.vip);
  }else{
    chip.style.display='none';vchip.style.display='none';
  }
}

  $('#adLogout').onclick=async()=>{await api('/api/admin/logout',{method:'POST',body:'{}'});state.admin=false;renderNav();PANELS.admin()};
  $$('[data-act]').forEach(b=>b.onclick=async()=>{
    let body='{}';
    if(b.dataset.act==='expiry'){
      const inp=$('#expDays_'+b.dataset.id);
      const days=parseInt((inp?inp.value:''),10);
      if(isNaN(days)){toast(T('请输入天数','Enter days'));return}
      body=JSON.stringify({days});
    }else if(b.dataset.act==='perm'||b.dataset.act==='owner'){
      body=JSON.stringify({on:b.dataset.on==='1'});
    }
    const r=await api(`/api/admin/users/${b.dataset.id}/${b.dataset.act}`,{method:'POST',body});
    if(r.ok){toast(T('操作成功','done'));PANELS.admin()}else toast(r.error||'failed');
  });
  $$('[data-job]').forEach(b=>b.onclick=async()=>{
    $('#trigMsg').className='form-msg';$('#trigMsg').textContent=b.dataset.job+' …';
    const r=await api(`/api/admin/trigger/${b.dataset.job}`,{method:'POST',body:'{}'});
    $('#trigMsg').className='form-msg '+(r.ok&&r.success?'ok':'err');
    $('#trigMsg').textContent=`${b.dataset.job}: ${r.success?'OK':'FAIL'} (${r.ms}ms)`;
  });
};

/* ================= 启动 ================= */
async function boot(){
  renderNav();
  // 时钟
  const tick=()=>{$('#clock').textContent=new Date().toLocaleTimeString('zh-CN',{hour12:false,timeZone:'Asia/Shanghai'})+' CST'};
  tick();setInterval(tick,1000);
  // 指纹
  const v=await api('/api/version');
  if(v.ok)$('#fp').textContent=`${v.name}@${v.version} sha:${v.dashboard_html.sha256_16} ${v.dashboard_html.bytes}B full:${v.dashboard_html.is_full_terminal}`;
  // 会话恢复（会员与后台互不影响）
  const me=await api('/api/auth/me');
  if(me.ok&&me.user&&me.user.status==='approved'){state.user=me.user}
  refreshUserChip();
  const ah=await api('/api/admin/users?status=pending');
  if(!ah.__needAdmin&&ah.ok)state.admin=true;
  // 涨跌配色切换（绿涨红跌 ↔ 红涨绿跌）
  (function(){
    var saved=null;try{saved=localStorage.getItem('w1_color_flip')}catch(e){}
    if(saved==='1')document.body.classList.add('cn-flip');
    var btn=$('#colorBtn');
    if(btn)btn.onclick=function(){
      document.body.classList.toggle('cn-flip');
      var on=document.body.classList.contains('cn-flip');
      try{localStorage.setItem('w1_color_flip',on?'1':'0')}catch(e){}
      if(on)btn.title='涨跌配色：红涨绿跌（点击切回）';else btn.title='涨跌配色：绿涨红跌（点击切换）';
      // 重绘当前 tab 使动态渲染的颜色立即生效
      switchTab(state.tab);
    };
  })();
  // 语言切换
  $('#langBtn').onclick=()=>{state.lang=state.lang==='zh'?'en':'zh';$('#langBtn').textContent=state.lang==='zh'?'EN':'中';renderNav();switchTab(state.tab)};
  $('#langBtn').textContent='EN';
  switchTab('overview');
}
boot();
</script>
